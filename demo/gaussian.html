<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <script type="text/javascript" src="js/util.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three.module.js",
          "@mkkellogg/gaussian-splats-3d": "./lib/gaussian-splats-3d.module.js"
        }
      }
    </script>
    <style>
      body {
        margin: 0px;
      }
      .gaussian_header {
        width: 100%;
        height: 60px;
        z-index: 1;
        position: absolute;

        background-color: white;
        opacity: 0.7;

        display: flex;
        justify-content: space-between;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div class="gaussian_header">
      <div id="header"></div>
      <button id="gaussian_complete_btn" onclick="openDemo()">선택 완료</button>
    </div>
    <script>
      // 헤더
      document.addEventListener("DOMContentLoaded", () => {
        fetch("header.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          })
          .catch((error) => console.error("Error loading header:", error));
      });

      function openHome(page) {
        let url = page + ".html";
        window.location = url;
      }

      function goBack() {
        console.log("뒤로가기");
        history.back();
      }
    </script>
    <script type="module">
      import * as GaussianSplats3D from "@mkkellogg/gaussian-splats-3d";
      import * as THREE from "three";

      import {
        insertRequest,
        getRobots,
        client,
      } from "./supaDatabase/connectDatabase.js";

      window.openDemo = openDemo;

      const urlParams = new URLSearchParams(window.location.search);
      let selectedCoordinates = JSON.parse(
        localStorage.getItem("selectedCoordinates")
      );
      let model_index;
      let initialCameraPosition = { x: 0, y: 0, z: 0 };

      let path_name;
      model_index = selectedCoordinates.model_num;
      console.log(model_index);
      const model_names = [
        "assets/data/new_scaling/(1)allnations_t.splat",
        "assets/data/new_scaling/(2)newton2_t.splat",
        "assets/data/new_scaling/(3)newton1_t.splat",
        "assets/data/new_scaling/(4)cloudbridge_t.splat",
        "assets/data/new_scaling/(5)fivestone_entrance.splat",
        "assets/data/new_scaling/(6)fivestone2_t.splat",
        "assets/data/new_scaling/(7)fivestone1_t.splat",
      ];
      path_name = model_names[model_index];

      document.addEventListener("DOMContentLoaded", () => {
        selectedCoordinates = JSON.parse(
          localStorage.getItem("selectedCoordinates")
        );

        if (selectedCoordinates) {
          const direction = new THREE.Vector3(0, 0, -1);
          direction.applyQuaternion(viewer.camera.quaternion);
          viewer.camera.position.set(
            selectedCoordinates.x,
            0,
            selectedCoordinates.y
          );
          viewer.controls.target.copy(viewer.camera.position).add(direction);
          viewer.controls.update();

          const event = new CustomEvent("selectedCoordinatesEvent", {
            detail: selectedCoordinates,
          });
          window.dispatchEvent(event); // 이벤트 디스패치

          const sphereGeometry = new THREE.SphereGeometry(10, 16, 16);
          const sphereMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ff00,
          });

          const sphereMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
          sphereMesh.position.set(
            initialCameraPosition.x,
            initialCameraPosition.y,
            initialCameraPosition.z
          );
          viewer.splatMesh.add(sphereMesh);
          console.log(
            `구 추가됨 {x: ${sphereMesh.position.x}, y: ${sphereMesh.position.y}, z: ${sphereMesh.position.z}}`
          );
        }
      });

      const viewer = new GaussianSplats3D.Viewer({
        cameraUp: [0, -1, 0],
        initialCameraPosition: [
          initialCameraPosition.x,
          initialCameraPosition.y,
          initialCameraPosition.z,
        ],
        initialCameraLookAt: [0, 0, 0],
        sphericalHarmonicsDegree: 0,
      });

      //임시. n을 누르면 특정 모델로 바뀜 나중에 할것
      document.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "n") {
          let selectedCoordinates = JSON.parse(
            localStorage.getItem("selectedCoordinates")
          ) || { x: 0, y: 0, model_num: 1 };

          //모델 번호 변경 (순환)
          selectedCoordinates.model_num =
            (selectedCoordinates.model_num % model_names.length) + 1;

          //새로운 좌표 값 설정 (예제)
          selectedCoordinates.x += 10; // X 좌표 증가
          selectedCoordinates.y += 5; // Y 좌표 증가

          //변경된 값 저장
          localStorage.setItem(
            "selectedCoordinates",
            JSON.stringify(selectedCoordinates)
          );

          //페이지 새로고침하여 변경 적용
          location.reload();
        }
      });

      viewer
        .addSplatScenes([
          {
            path: path_name,
            rotation: [0, 0, 0, 0],
            scale: [50, 50, 50],
            position: [0, 10, 0],
          },
        ])
        .then(async () => {
          viewer.start();
          createBoxes();
          // 좌표를 읽은 후 박스 생성
          /* const coordinates = await loadCoordinates();
      createTransparentBox(coordinates); */
          const coordinatesArray = await loadCoordinates();
          coordinatesArray.forEach((coordinates) => {
            createTransparentBox(coordinates);
          });

          // JSON 파일에서 좌표를 읽어오는 함수
          async function loadCoordinates() {
            let box_coord = [
              "box_coord(1).json",
              "box_coord(2).json",
              "box_coord(3).json",
              "box_coord(4).json",
              "box_coord(5).json",
              "box_coord(6).json",
            ];

            const response = await fetch(box_coord[model_index]);
            //console.log(box_coord[model_index]);
            const data = await response.json();
            /* console.log("좌표", data); */
            /* return data; */
            return Array.isArray(data) ? data : [data];
          }

          let currentTextMesh = null;

          async function createBoxes() {
            const coordinatesArray = await loadCoordinates();

            coordinatesArray.forEach((coordinates) => {
              createTransparentBox(coordinates);
            });
          }

          // 3d 박스를 생성하는 함수
          function createTransparentBox(coordinates) {
            const { leftTop, rightBottom, info, nextIndex } = coordinates;

            const sizeOffset = 0;
            const width = leftTop.x - rightBottom.x * (1 + sizeOffset);
            const height = leftTop.y - rightBottom.y * (1 + sizeOffset);
            const depth = leftTop.z - rightBottom.z * (1 + sizeOffset);
            /* console.log(
          `박스 크기 - width: ${width}, height: ${height}, depth: ${depth}`
        ); */

            const boxGeometry = new THREE.BoxGeometry(width, height, depth);
            let boxMaterial;
            if (nextIndex.index != -2) {
              //벽이 아니면 색있는 박스 생성
              boxMaterial = new THREE.MeshBasicMaterial({
                color: 0x12592f,
                transparent: false,
                opacity: 0,
              });
            } else {
              boxMaterial = new THREE.MeshBasicMaterial({
                //벽이면 투명하게 생성
                depthWrite: false, //렌더링X
                depthTest: false, //다른 객체가 가려지지 않도록
                transparent: true,
                opacity: 0,
              });
            }
            const boxMesh = new THREE.Mesh(boxGeometry, boxMaterial);

            const centerX = (leftTop.x + rightBottom.x) / 2;
            const centerY = (leftTop.y + rightBottom.y) / 2;
            const centerZ = (leftTop.z + rightBottom.z) / 2;
            boxMesh.position.set(centerX, centerY, centerZ);
            boxMesh.rotation.set(0, 0, 0);

            viewer.splatMesh.add(boxMesh);
            /* viewer.scene.add(boxMesh); */
            console.log(
              `박스 추가됨 {x: ${boxMesh.position.x}, y: ${boxMesh.position.y}, z: ${boxMesh.position.z}}`
            );

            // 박스 클릭
            boxMesh.userData = {
              clickable: true,
              info: info,
              nextIndex: nextIndex,
              angle: coordinates.angle ? coordinates.angle.ANGLE : null,
              leftTop: coordinates.leftTop,
              rightBottom: coordinates.rightBottom,
            };
            boxMesh.onClick = (clickPoint) => {
              if (currentTextMesh) {
                viewer.splatMesh.remove(currentTextMesh.text);
                viewer.splatMesh.remove(currentTextMesh.background);
                currentTextMesh = null;
              }
              console.log("박스가 클릭되었습니다!");
              createRectangleWithText(boxMesh, info, clickPoint);

              if (nextIndex.index > -1) {
                let selectedCoordinates = JSON.parse(
                  localStorage.getItem("selectedCoordinates")
                );
                //모델 번호 변경 (순환)
                selectedCoordinates.model_num = nextIndex.index;
                //새로운 좌표 값 설정 (예제)
                selectedCoordinates.x = nextIndex.startX; // 초기 X 좌표 수정
                selectedCoordinates.y = nextIndex.startZ; // 초기 Z 좌표 수정
                //변경된 값 저장
                localStorage.setItem(
                  "selectedCoordinates",
                  JSON.stringify(selectedCoordinates)
                );
                //페이지 새로고침하여 변경 적용
                location.reload();
              }
            };

            // Raycaster를 사용하여 클릭 이벤트 처리
            viewer.renderer.domElement.addEventListener("click", (event) => {
              const mouse = new THREE.Vector2();
              mouse.x =
                (event.clientX / viewer.renderer.domElement.clientWidth) * 2 -
                1;
              mouse.y =
                -(event.clientY / viewer.renderer.domElement.clientHeight) * 2 +
                1;

              const raycaster = new THREE.Raycaster();
              raycaster.setFromCamera(mouse, viewer.camera);

              const intersects = raycaster.intersectObjects(
                viewer.splatMesh.children,
                true
              );

              // 클릭한 대상이 클릭 가능한 객체(박스)인 경우
              if (
                intersects.length > 0 &&
                intersects[0].object.userData.clickable
              ) {
                // 클릭한 대상이 3D 박스이면, 클릭한 위치(교차점)를 인자로 전달
                intersects[0].object.onClick(intersects[0].point);
              } else {
                // 3D 박스 외의 영역을 클릭하면 기존 텍스트 제거
                if (currentTextMesh) {
                  viewer.splatMesh.remove(currentTextMesh.text);
                  viewer.splatMesh.remove(currentTextMesh.background);
                  currentTextMesh = null;
                }
              }
            });
          }

          let isInsideSpecialBox = false; // 현재 박스 안에 있는지 추적

          function checkCameraInsideBox() {
            //벽에 닿았는지 확인
            const cameraPosition = viewer.camera.position;

            viewer.splatMesh.children.forEach((child) => {
              if (child.userData.clickable) {
                const box = new THREE.Box3().setFromObject(child);

                if (box.containsPoint(cameraPosition)) {
                  if (!child.userData.inside) {
                    child.userData.inside = true;

                    if (
                      child.userData.nextIndex.index === -2 &&
                      !isInsideSpecialBox
                    ) {
                      isInsideSpecialBox = true; // 한 번만 실행하도록 설정

                      const event = new CustomEvent("Wall_Collision_Check", {
                        detail: {
                          angle: child.userData.angle,
                          leftTop: child.userData.leftTop,
                          rightBottom: child.userData.rightBottom,
                        },
                      });
                      window.dispatchEvent(event);
                    }
                  }
                } else {
                  if (child.userData.inside) {
                    isInsideSpecialBox = false; // 박스 밖으로 나가면 다시 이벤트 발생 가능
                  }
                  child.userData.inside = false;
                }
              }
            });

            requestAnimationFrame(checkCameraInsideBox);
          }

          //프로그램 시작 시 실행
          checkCameraInsideBox();

          function createRectangleWithText(boxMesh, info, clickPoint) {
            if (currentTextMesh) {
              viewer.splatMesh.remove(currentTextMesh.text);
              viewer.splatMesh.remove(currentTextMesh.background);
              currentTextMesh = null;
            }
            /* 사각형 생성 */
            const rectGeometry = new THREE.PlaneGeometry(
              boxMesh.geometry.parameters.width * 0.5,
              20
            );
            const rectMaterial = new THREE.MeshBasicMaterial({
              color: 0x12592f,
              transparent: false,
              /* transparent: true, */
              opacity: 0,
            });
            const rectMesh = new THREE.Mesh(rectGeometry, rectMaterial);

            const scaleFactor = 3; // 글씨 크기 조절
            const fontSize = 20 * scaleFactor; // 폰트 크기
            const padding = 10 * scaleFactor; // 텍스트 주변 패딩

            /* 텍스트 캔버스 생성 */
            const textCanvas = document.createElement("canvas");
            const textCtx = textCanvas.getContext("2d");

            /* 폰트 설정 */
            textCtx.font = `bold ${fontSize}px Arial`;

            const lines = info.name.split("\n");

            // 각 줄에 대해 텍스트 크기 계산
            const lineHeight = fontSize; // 줄 간격
            const textWidth =
              Math.max(...lines.map((line) => line.length * fontSize * 0.18)) +
              padding * 2; // 가장 긴 줄의 너비
            const textHeight = lines.length * (lineHeight - 40); // 모든 줄의 높이

            /* 캔버스 크기 설정 */
            textCanvas.width = textWidth;
            textCanvas.height = textHeight;

            /* 텍스트 채우기 */
            textCtx.fillStyle = "black";
            textCtx.textAlign = "center";
            textCtx.textBaseline = "middle";

            // 글씨 쓰기
            lines.forEach((line, index) => {
              textCtx.fillText(
                line,
                textWidth / 2,
                index * (lineHeight - 40) + padding / 3
              );
            });

            /* 텍스처 생성 */
            const textTexture = new THREE.CanvasTexture(textCanvas);
            textTexture.anisotropy =
              viewer.renderer.capabilities.getMaxAnisotropy();

            /* 텍스트 메시 생성 */
            const textMaterial = new THREE.MeshBasicMaterial({
              map: textTexture,
              transparent: true,
              depthTest: false,
            });

            const textGeometry = new THREE.PlaneGeometry(
              textWidth / scaleFactor,
              textHeight / scaleFactor
            );
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);

            /* 배경 메시(Plane) 생성 */
            const backgroundGeometry = new THREE.PlaneGeometry(
              textWidth / scaleFactor,
              textHeight / scaleFactor
            );
            const backgroundMaterial = new THREE.MeshBasicMaterial({
              color: 0xffffff,
              /* 이걸 해제해야 글씨가 잘보임 */
              /* transparent: true, */
              opacity: 0,
            });
            const backgroundMesh = new THREE.Mesh(
              backgroundGeometry,
              backgroundMaterial
            );

            /* 위치 설정 */
            backgroundMesh.position.set(
              clickPoint.x,
              /* boxMesh.position.x, */
              boxMesh.position.y + boxMesh.geometry.parameters.height / 2 - 10,
              /* boxMesh.position.z */
              clickPoint.z
            );

            textMesh.position.set(
              clickPoint.x,
              /* boxMesh.position.x, */
              boxMesh.position.y + boxMesh.geometry.parameters.height / 2 - 5,
              /* boxMesh.position.z + 0.1 */
              clickPoint.z + 0.1
            );

            /* 카메라를 바라보도록 설정 */
            textMesh.lookAt(viewer.camera.position);
            backgroundMesh.lookAt(viewer.camera.position);
            textMesh.rotation.z += Math.PI;
            backgroundMesh.rotation.z += Math.PI;

            /* 씬에 추가 */
            viewer.splatMesh.add(backgroundMesh);
            viewer.splatMesh.add(textMesh);

            currentTextMesh = { text: textMesh, background: backgroundMesh };
          }
        });

      let maxZoom = 50; // 최대 줌 레벨
      let minZoom = 0.1; // 최소 줌 레벨

      // 화살표 키로 카메라 이동 처리
      document.addEventListener("keydown", function (event) {
        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();
        const up = new THREE.Vector3(0, 1, 0);

        viewer.camera.getWorldDirection(forward); // 앞쪽 방향 벡터
        forward.normalize();
        right.crossVectors(forward, up).normalize(); // 옆쪽 방향 벡터

        const moveDirection = new THREE.Vector3(0, 0, 0);

        // 카메라 이동 처리
        viewer.camera.position.add(moveDirection);
      });

      // 휠로 확대/축소 처리
      document.addEventListener("wheel", function (event) {
        console.log("wheel event");
        const zoomSpeed = 0.1;
        if (event.deltaY < 0) {
          // 줌 인
          viewer.camera.zoom = Math.min(
            viewer.camera.zoom + zoomSpeed,
            maxZoom
          );
        } else {
          // 줌 아웃
          viewer.camera.zoom = Math.max(
            viewer.camera.zoom - zoomSpeed,
            minZoom
          );
        }

        // 카메라의 위치가 설정된 범위를 넘지 않도록 제한
        viewer.camera.position.x = Math.max(
          -450,
          Math.min(350, viewer.camera.position.x)
        );
        viewer.camera.position.y = Math.max(
          0,
          Math.min(350, viewer.camera.position.y)
        );
        viewer.camera.position.z = Math.max(
          -550,
          Math.min(350, viewer.camera.position.z)
        );

        viewer.camera.updateProjectionMatrix();
      });

      // 로봇 데이터
      robotData();

      // 실시간으로 DB 지켜보기
      client
        .channel("room1")
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "robots",
          },
          (payload) => {
            robotData();
          }
        )
        .subscribe();

      // 로봇 상태
      let robotStatus = 0;

      async function robotData() {
        const robots = await getRobots();
        const robotId = localStorage.getItem("robot");

        robots.forEach((robot) => {
          if (robot.id === parseInt(robotId)) {
            robotStatus = robot.status;
          }
        });
      }

      // 페이지 이동
      // 만약 destin이 0이면 목적지 선택으로 이동
      // 만약 destin이 1이면 moving 페이지로 이동
      function openDemo() {
        // 만약 로봇이 사용중이라면
        if (robotStatus === 1) {
          alert("이미 사용중인 로봇입니다. 로봇 선택 페이지로 이동합니다.");
          window.location.href = "selectrobot.html";
          return 0;
        }

        const destin = localStorage.getItem("destin");
        const robotId = localStorage.getItem("robot");
        const top = localStorage.getItem("top");
        const left = localStorage.getItem("left");
        console.log(destin);

        let userConfirmed = false;
        let url;

        //미니맵에서 찍은 위치 로컬 스토리지에 저장
        localStorage.setItem(
          destin === "0" ? "start" : "end",
          JSON.stringify({ top, left })
        );

        if (destin === "0") {
          // 목적지 페이지로
          localStorage.setItem("destin", 1);
          localStorage.setItem("robot", robotId);
          const url = `minimap.html`;
          window.location.href = url;
        } else if (destin === "1") {
          const startCoord = JSON.parse(localStorage.getItem("robotStart"));
          userConfirmed = window.confirm("로봇을 이동시키시겠습니까?");
          if (userConfirmed) {
            insertRequest(robotId, true, [
              startCoord.robotX,
              startCoord.robotY,
            ]).then(() => {
              // moving 페이지로
              if (userConfirmed) {
                localStorage.setItem("destin", 0);
                localStorage.setItem("robot", robotId);
                const url = `moving.html`;
                window.location.href = url;
                // window.location = `moving.html?robot=${robot}&destin=${0}`;
              }
            });
          }
        }
      }
    </script>
  </body>
</html>

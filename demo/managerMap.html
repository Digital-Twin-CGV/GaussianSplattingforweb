<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        /* overflow: hidden; */
        background-color: #f8f8f8;
      }
      .managerMap_container {
        display: flex;
        flex-direction: column;
        align-items: center;

        position: relative;
      }

      /* 미니맵 컨테이너 */
      .managerMap_map_container {
        display: flex;
        justify-content: center;

        position: relative;
      }

      /* 미니맵 */
      .managerMap_map_img {
        width: 95vh;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 1000px) {
        .managerMap_map_img {
          height: 100%;
          width: 100%;
        }
      }

      /* 경로 선 */
      .path_line {
        stroke: black;
        stroke-width: 2;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div class="managerMap_container">
      <div class="managerMap_map">
        <div class="managerMap_map_container" id="managerMap_map">
          <img
            class="managerMap_map_img"
            id="managerMap_map_img"
            src="assets/images/Minimap.png"
          />
        </div>
      </div>
    </div>

    <script type="module">
      import {
        getRobots,
        getRequest,
        insertRequest,
        client,
      } from "./supaDatabase/connectDatabase.js";
      // 페이지 이동 ( minimap 페이지로 이동함 )
      function openPage(page, robot) {
        let url;
        if (page == "minimap") {
          // 로봇 선택 페이지로 넘어갈 때
          // 출발지 선택 페이지 : destin=0, 목적지 선택 페이지 : destin=1
          url =
            page +
            `.html?destin=0&robot=${robot.id}&bottom=${robot.position[1]}&left=${robot.position[0]}`;
        }
        window.location = url;
      }

      // 데이터 불러오기
      robotData();
      requestData();

      // 실시간으로 DB 지켜보기
      // robots
      client
        .channel("robots")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "robots" },
          (payload) => {
            robotData();
          }
        )
        .subscribe();
      // requests
      client
        .channel("request")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "request" },
          (payload) => {
            requestData();
          }
        )
        .subscribe();

      // 로봇 데이터
      async function robotData() {
        const robots = await getRobots();

        // 기존 마커 제거
        const markers = document.querySelectorAll(".robot_marker_container");
        markers.forEach((marker) => marker.remove());

        robots.forEach((robot) => {
          const marker_container = createRobotMarker(
            robot,
            "managerMap_map_img",
            0
          );
          document
            .querySelector(".managerMap_map_container")
            .appendChild(marker_container);
        });
      }

      const logs = [];

      // log를 만들 response, request 데이터
      async function requestData() {
        const requests = await getRequest();
      }

      let controlRobotHandler; // 로봇 제어 이벤트 핸들러
      let stopRobotHandler; // 로봇 정지 이벤트 핸들러

      // 로봇 제어 버튼
      function controlRobot(robot) {
        if (robot.status === 1) {
          alert("로봇이 이미 사용중입니다.");
        } else {
          openPage("minimap", robot);
        }
      }

      // 로봇 정지 버튼
      function stopRobot(robot) {
        // DB에 정지 요청
        insertRequest(robot.id, false);
        alert(`로봇${robot.id}을 즉시 정지합니다.`);
      }
    </script>
  </body>
</html>

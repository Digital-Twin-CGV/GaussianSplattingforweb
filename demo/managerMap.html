<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        /* overflow: hidden; */
        background-color: #f8f8f8;
      }

      .managerMap_container {
        display: flex;
        flex-direction: row;
        align-items: center;

        height: 100vh;
      }

      /* 미니맵 컨테이너 */
      .managerMap_map_container {
        display: flex;
        justify-content: center;

        position: relative;
      }

      /* 미니맵 */
      .managerMap_map_img {
        width: 95vh;
      }

      .managerMap_left {
        background-color: white;

        display: flex;
        flex-direction: column;
        align-items: center;

        height: 100%;
        min-width: 30vh;
      }

      .managerMap_logo {
        margin: 30px 0px;
      }

      .managerMap_robots {
        width: 100%;
      }

      .managerMap_robot_info_container {
        border: 1px solid #3fe2f4;
        margin: 20px 20px;
        border-radius: 58px;
        padding: 10px 20px;

        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 1000px) {
        .managerMap_map_img {
          height: 100%;
          min-width: 700px;
        }
      }

      /* 경로 선 */
      .path_line {
        stroke: black;
        stroke-width: 2;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div class="managerMap_container">
      <div class="managerMap_left">
        <svg
          width="188"
          height="64"
          viewBox="0 0 188 64"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="managerMap_logo"
        >
          <path

            fill="#3FE2F4"
          />
          <path
            d="M31.9095 63.667C13.2956 63.667 0 50.2194 0 31.8335C0 13.4476 13.2956 0 31.9095 0C47.4083 0 59.0325 9.04102 62.2235 20.6652H53.5623C51.0551 12.9917 42.47 7.29359 32.0614 7.29359C18.0061 7.29359 7.97737 17.5502 7.97737 31.8335C7.97737 46.1927 18.0061 56.5253 32.2134 56.5253C44.6733 56.5253 53.9422 48.32 54.8539 37.3037H30.6179V30.39H63.3631V33.1251C63.3631 51.0551 49.6876 63.667 31.9095 63.667Z"
            fill="#3FE2F4"
          />
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M165.412 55.2003C173.725 55.2003 180.464 48.4611 180.464 40.1478C180.464 31.8345 173.725 25.0952 165.412 25.0952C157.099 25.0952 150.359 31.8345 150.359 40.1478C150.359 48.4611 157.099 55.2003 165.412 55.2003ZM165.412 62.1093C177.541 62.1093 187.373 52.2768 187.373 40.1478C187.373 28.0188 177.541 18.1863 165.412 18.1863C153.283 18.1863 143.45 28.0188 143.45 40.1478C143.45 52.2768 153.283 62.1093 165.412 62.1093Z"
            fill="#3FE2F4"

          <path
            d="M89.4525 18.407C101.212 18.7049 110.673 28.2477 110.843 40.0388H110.848V61.9597H103.939V56.3503C100.008 60.0527 94.7124 62.3229 88.8861 62.323L88.3187 62.3162C76.6401 62.0202 67.2269 52.6071 66.931 40.9285L66.9242 40.3621C66.9242 28.2331 76.7571 18.4001 88.8861 18.4001L89.4525 18.407ZM88.8861 25.0369C80.4227 25.0369 73.5609 31.8986 73.5609 40.3621C73.5611 48.8253 80.4228 55.6863 88.8861 55.6863C96.3647 55.6861 102.591 50.3283 103.939 43.2419V40.0388H104.206C104.034 31.7247 97.2413 25.0371 88.8861 25.0369Z"
            fill="#3FE2F4"
          />
        </svg>

        <div class="managerMap_robots"></div>
      </div>
      <div class="managerMap_map">
        <div class="managerMap_map_container" id="managerMap_map">
          <img
            class="managerMap_map_img"
            id="managerMap_map_img"
            src="assets/images/Minimap.png"
          />
        </div>
      </div>
    </div>

    <script type="module">
      import {
        getRobots,
        getRequest,
        insertRequest,
        client,
      } from "./supaDatabase/connectDatabase.js";
      // 페이지 이동 ( minimap 페이지로 이동함 )
      function openPage(page, robot) {
        let url;
        if (page == "minimap") {
          // 로봇 선택 페이지로 넘어갈 때
          // 출발지 선택 페이지 : destin=0, 목적지 선택 페이지 : destin=1
          url =
            page +
            `.html?destin=0&robot=${robot.id}&bottom=${robot.position[1]}&left=${robot.position[0]}`;
        }
        window.location = url;
      }

      // 데이터 불러오기
      robotData();
      requestData();

      // 실시간으로 DB 지켜보기
      // robots
      client
        .channel("robots")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "robots" },
          (payload) => {
            robotData();
          }
        )
        .subscribe();
      // requests
      client
        .channel("request")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "request" },
          (payload) => {
            requestData();
          }
        )
        .subscribe();

      // 로봇 데이터
      async function robotData() {
        const robots = await getRobots();

        // 기존 마커 제거
        const markers = document.querySelectorAll(".robot_marker_container");
        markers.forEach((marker) => marker.remove());

        // 기존 리스트 제거
        const lists = document.querySelectorAll(
          ".managerMap_robot_info_container"
        );
        lists.forEach((list) => list.remove());

        // 로봇 id 순서대로
        robots.sort((a, b) => a.id - b.id);

        robots.forEach((robot) => {
          const marker_container = managerRobotMarker(
            robot,
            "managerMap_map_img",
            0
          );
          document
            .querySelector(".managerMap_map_container")
            .appendChild(marker_container);

          const robot_information = robotList(robot);
        });
      }

      // 로봇 리스트
      function robotList(robot) {
        const list = document.querySelector(".managerMap_robots");
        const robotInfoContainer = document.createElement("div");
        robotInfoContainer.className = "managerMap_robot_info_container";

        const robotName = document.createElement("div");
        robotName.innerHTML = `Robot ${robot.id}`;

        const robotStatus = document.createElement("div");
        robotStatus.style.backgroundColor = robotStatusColor(robot.status);
        robotStatus.style.width = "10px";
        robotStatus.style.height = "10px";
        robotStatus.style.borderRadius = "8px";

        robotInfoContainer.appendChild(robotName);
        robotInfoContainer.appendChild(robotStatus);
        list.appendChild(robotInfoContainer);
      }

      // 로봇 상태 색상
      function robotStatusColor(status) {
        if (status == 3) {
          return "rgba(29, 210, 0, 1)";
        } else {
          return "rgba(255, 0, 0, 1)";
        }
      }

      const logs = [];

      // log를 만들 response, request 데이터
      async function requestData() {
        const requests = await getRequest();
      }

      let controlRobotHandler; // 로봇 제어 이벤트 핸들러
      let stopRobotHandler; // 로봇 정지 이벤트 핸들러

      // 로봇 제어 버튼
      function controlRobot(robot) {
        if (robot.status === 1) {
          alert("로봇이 이미 사용중입니다.");
        } else {
          openPage("minimap", robot);
        }
      }

      // 로봇 정지 버튼
      function stopRobot(robot) {
        // DB에 정지 요청
        insertRequest(robot.id, false);
        alert(`로봇${robot.id}을 즉시 정지합니다.`);
      }
    </script>
  </body>
</html>

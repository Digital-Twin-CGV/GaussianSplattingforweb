<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        background-color: rgba(248, 248, 248, 1);
      }

      .minimap_container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .minimap_title {
        text-align: center;
        width: 100%;
        background-color: white;
      }

      .minimap_map {
        display: flex;
        justify-content: center;

        position: relative;
        cursor: pointer;
      }

      #minimap_gaussian {
        height: 75vh;
      }

      /* 전체 모달 배경 */
      #selectdest_modal {
        display: flex;
        pointer-events: none; /* 클릭 무시 */
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: flex-end;
        z-index: 1000;
      }

      /* 모달 내용 */
      .selectdest_modal-content {
        pointer-events: auto;
        background-color: white;
        width: 100%;
        max-height: 20vh;
        border-radius: 20px 20px 0 0;
        padding: 20px;
        padding-top: 10px;
        /* animation: slideUp 0.4s ease-out; */
      }

      .modal-line {
        width: 40px;
        border: 2px solid #bbbbbb;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .complete_selection {
        width: 100%;
        height: 56px;
        border-radius: 40px;
        padding: 10px 20px;
        margin-bottom: 30px;
        background-color: white;
        border: 1px solid rgba(63, 226, 244, 1);
        color: #222222;
        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
      }
      .complete_selection:hover {
        background-color: rgba(63, 226, 244, 1);
        color: white;
        font-weight: bold;
      }

      .selectdest_modal_above {
        /* display: flex; */
        align-items: center;

        margin-bottom: 10px;
      }

      .selectdest_modal_title {
        font-size: 16px;
        color: #222222;
        font-weight: bold;

        display: flex;
        justify-content: center;
        align-items: center;
      }
      .selectdest_modal_detail {
        font-size: 12px;
        color: #222222;

        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 5px;
        margin-bottom: 30px;
      }

      /* 애니메이션 */
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 1000px) {
        #minimap_gaussian {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div id="header"></div>
    <div class="minimap_container">
      <div class="minimap_map" id="minimap_map">
        <img
          id="minimap_gaussian"
          alt="gaussian_img"
          src="assets/images/Minimap2.png"
        />
      </div>
    </div>

    <div id="selectdest_modal">
      <div class="selectdest_modal-content">
        <hr class="modal-line" />
        <div class="selectdest_modal_above">
          <div class="selectdest_modal_title" id="robot-info"></div>
          <div class="selectdest_modal_detail">
            지도를 움직여 위치를 지정하세요.
          </div>
        </div>
        <button
          class="complete_selection"
          ,
          type="button"
          ,
          onclick="openPage()"
        >
          선택 완료
        </button>
      </div>
    </div>
    <canvas id="colorCanvas" style="display: none"></canvas>
    <script type="module">
      import {
        insertRequest,
        getRobots,
        client,
      } from "./supaDatabase/connectDatabase.js";

      const destin = localStorage.getItem("destin"); // 출발지인지 목적지인지. 0 : 출발지, 1 : 목적지
      const robotId = localStorage.getItem("robot"); // 로봇 번호

      // 제목 설정
      const titleElement = document.getElementById("robot-info");
      if (destin === "0") {
        titleElement.textContent = "첫 번째 목적지를 선택해주세요.";
      } else if (destin === "1") {
        titleElement.textContent = "두 번째 목적지를 선택해주세요.";
      }

      // 출발지 마커
      if (destin == 1) {
        // 목적지를 찍는 페이지라면 ...
        document.addEventListener("DOMContentLoaded", () => {
          // marker와 label을 넣는 container
          const start = document.createElement("div");
          const startCoordin = JSON.parse(localStorage.getItem("start"));

          // 마커 위치
          const x = startCoordin.x - (100 * 19) / minimapRect.width;
          const y = startCoordin.y - (100 * 42) / minimapRect.height;

          start.className = "minimap_start";
          start.style.position = "absolute";
          start.style.top = y + "%";
          start.style.left = x + "%";
          start.style.display = "flex";
          start.style.alignItems = "flex-start";

          // marker
          const startMarker = document.createElement("div");
          startMarker.innerHTML = `
                <svg width="38" height="48" viewBox="0 0 23 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11.4424 1.15625C17.0886 1.15635 21.666 5.73368 21.666 11.3799C21.666 14.1007 20.6117 17.0209 18.7705 20.1875C16.9354 23.3436 14.3687 26.6593 11.4453 30.168C8.54609 26.6575 5.97826 23.3407 4.13477 20.1836C2.285 17.0156 1.2188 14.0976 1.21875 11.3799C1.21875 5.73362 5.79612 1.15625 11.4424 1.15625Z" fill="white" stroke="#6BE3F0" stroke-width="2"/>
      <path d="M11.2175 16.0449L11.2175 10.8513L11.1367 10.8513L9.54903 11.9546L9.54903 10.7346L11.2219 9.57302L12.5719 9.57302L12.5719 16.0449L11.2175 16.0449Z" fill="#6BE3F0"/>
      </svg>
      `;
          startMarker.style.backgroundSize = "cover";
          startMarker.style.backgroundRepeat = "no-repeat";
          startMarker.style.backgroundPosition = "center";

          // label
          const startLabel = document.createElement("span");

          start.appendChild(startMarker);
          start.appendChild(startLabel);
          document.querySelector(".minimap_map").appendChild(start);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetch("header.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          })
          .catch((error) => console.error("Error loading header:", error));
      });

      function convertCoordinates(x, y, width, height) {
        // 이미지 상의 클릭 범위를 기준으로 실제 좌표를 계산
        const leftTop = { x: -410, y: 212 }; // 좌측 상단
        const rightBottom = { x: 485, y: -512 }; // 우측 하단

        const miniMapWidth = window.innerWidth;
        const miniMapHeight = window.innerHeight;

        // 미니맵의 X, Y 좌표를 0 ~ 1로 정규화
        const normalizedX = x / miniMapWidth;
        const normalizedY = y / miniMapHeight;

        const worldX = leftTop.x + normalizedX * (rightBottom.x - leftTop.x);
        const worldY = leftTop.y + normalizedY * (rightBottom.y - leftTop.y);

        // 소수점 두 자리까지 반환
        return { x: worldX.toFixed(6), y: worldY.toFixed(6) };
      }

      let isMarkerSelected = null;

      function setMarkerSelected(isSelected) {
        isMarkerSelected = isSelected;
      }

      const minimap = document.getElementById("minimap_map");
      // 미니맵의 정보
      const minimapRect = minimap.getBoundingClientRect();
      const background = document.getElementById("minimap_gaussian");
      const canvas = document.getElementById("colorCanvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      // 마커, 라벨 저장할 변수
      let markerContainer = null;

      background.addEventListener("load", () => {
        canvas.width = background.width;
        canvas.height = background.height;
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
      });

      let selectedX = null;
      let selectedY = null;

      let robotX = null;
      let robotY = null;

      // 클릭한 부분
      minimap.addEventListener("click", (event) => {
        // 이미지에서 marker 위치
        // 왼쪽 위를 원점
        const x =
          (100 * (event.clientX - minimapRect.left - 19)) / minimapRect.width;
        const y =
          (100 * (event.clientY - minimapRect.top - 42)) / minimapRect.height;

        // 클릭한 위치의 색 가져오기
        const pixelData = ctx.getImageData(
          (x * minimapRect.width) / 100 + 19,
          (y * minimapRect.height) / 100 + 42,
          1,
          1
        ).data;

        const color = `rgb(${pixelData[0]}, ${pixelData[1]}, ${pixelData[2]})`;
        console.log(color);
        if (color === "rgb(208, 230, 246)") {
          // 마커 좌표
          console.log("마커 위치:", x, y);
          localStorage.setItem(
            destin === "0" ? "start" : "end",
            JSON.stringify({ x, y })
          );

          // 사람이 선택한 부분. %.
          selectedX =
            (100 * (event.clientX - minimapRect.left)) / minimapRect.width;
          selectedY =
            (100 * (event.clientY - minimapRect.top)) / minimapRect.height;
          if (markerContainer && minimap.contains(markerContainer)) {
            minimap.removeChild(markerContainer);
          }

          // a, b는 클릭한 부분을 로봇 좌표로 변경한 것 (지도의 빨간 1px짜리가 원점)
          // 사용자는 왼쪽 위가 원점
          robotX =
            (((100 * (event.clientX - minimapRect.left)) / minimapRect.width -
              (2750 * 100) / 3299) *
              3299) /
            100;

          robotY =
            (((2457 * 100) / 3133 -
              (100 * (event.clientY - minimapRect.top)) / minimapRect.height) *
              3133) /
            100;

          console.log("로봇 좌표 찐:", robotX, robotY);

          let model_index = -1; // 기본값 (해당 없음)

          // 인덱스 0
          if (
            selectedX >= 82.51 &&
            selectedX <= 91.4553 &&
            selectedY >= 77.0424 &&
            selectedY <= 89.4141
          ) {
            model_index = 0;

            // 인덱스 1
          } else if (
            selectedX >= 56.2083 &&
            selectedX <= 81.5754 &&
            selectedY >= 88.2894 &&
            selectedY <= 91.6636
          ) {
            model_index = 1;

            // 인덱스 2
          } else if (
            selectedX >= 35.6475 &&
            selectedX <= 55.8077 &&
            selectedY >= 91.1012 &&
            selectedY <= 93.7724
          ) {
            model_index = 2;

            // 인덱스 3
          } else if (
            selectedX >= 31.7 &&
            selectedX <= 34.2 &&
            selectedY >= 76.55 &&
            selectedY <= 94.3
          ) {
            model_index = 3;

            // 인덱스 4
          } else if (
            selectedX >= 24.05 &&
            selectedX <= 33.6 &&
            selectedY >= 74.35 &&
            selectedY <= 75.7
          ) {
            model_index = 4;

            // 인덱스 5
          } else if (
            selectedX >= 19.44 &&
            selectedX <= 24.9 &&
            selectedY >= 37.9 &&
            selectedY <= 73
          ) {
            model_index = 5;

            // 인덱스 6
          } else if (
            selectedX >= 16.35 &&
            selectedX <= 20.5604 &&
            selectedY >= 13.5327 &&
            selectedY <= 37.6
          ) {
            model_index = 6;
          } else {
            setMarkerSelected(false);
          }

          console.log(
            "x",
            selectedX,
            "y",
            selectedY,
            "모델 인덱스 : ",
            model_index
          );

          // 마커와 라벨을 감싸는 컨테이너 생성
          markerContainer = document.createElement("div");
          markerContainer.style.position = "absolute";
          markerContainer.style.top = `${y}%`;
          markerContainer.style.left = `${x}%`;
          markerContainer.style.display = "flex";
          markerContainer.style.alignItems = "flex-start";

          // 마커 생성
          const marker = document.createElement("div");
          marker.innerHTML =
            destin === "0"
              ? `<svg width="38" height="48" viewBox="0 0 134 139" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M112.464 49.7813C112.464 74.6317 90.9285 95.961 66.9999 119.643C41.9065 94.7769 21.5356 74.6317 21.5356 49.7813C21.5356 24.9309 41.8907 4.78571 66.9999 4.78571C92.1092 4.78571 112.464 24.9309 112.464 49.7813Z" fill="#6BE3F0"/>
      <ellipse cx="67" cy="132.804" rx="14.3571" ry="5.98214" fill="#B9B7B7"/>
      <path d="M65.4652 69.9286V42.6818H65.325L56.7256 48.5237V42.2612L65.4418 36.2089H72.4521V69.9286H65.4652Z" fill="white"/>
      </svg>
      `
              : `<svg width="38" height="48" viewBox="0 0 134 139" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M112.464 49.7813C112.464 74.6317 90.9285 95.961 66.9999 119.643C41.9065 94.7769 21.5356 74.6317 21.5356 49.7813C21.5356 24.9309 41.8907 4.78571 66.9999 4.78571C92.1092 4.78571 112.464 24.9309 112.464 49.7813Z" fill="#6BE3F0"/>
      <ellipse cx="67.0002" cy="132.804" rx="14.3571" ry="5.98214" fill="#B9B7B7"/>
      <path d="M54.0853 69.9286V65.0915L66.0029 53.9451C67.4672 52.5897 68.5733 51.4603 69.3211 50.5567C70.0688 49.6532 70.5751 48.8431 70.84 48.1265C71.1204 47.4099 71.2606 46.6621 71.2606 45.8832V45.8364C71.2606 44.9173 71.0425 44.1072 70.6063 43.4062C70.1701 42.6896 69.5625 42.1288 68.7836 41.7237C68.0203 41.3187 67.1401 41.1162 66.1431 41.1162C64.9903 41.1162 63.9777 41.3498 63.1053 41.8172C62.2329 42.269 61.5474 42.8999 61.0489 43.71C60.5504 44.5045 60.2856 45.408 60.2544 46.4206L60.231 46.6309H53.6881V46.444C53.6881 44.3253 54.2255 42.4559 55.3004 40.8357C56.3753 39.2 57.8475 37.9226 59.7169 37.0034C61.6019 36.0843 63.7284 35.6247 66.0963 35.6247C68.4798 35.6247 70.5751 36.0454 72.3823 36.8866C74.1894 37.7123 75.5992 38.8651 76.6118 40.345C77.6244 41.825 78.1307 43.523 78.1307 45.4392V45.4859C78.1307 46.8413 77.8815 48.1031 77.383 49.2715C76.9 50.4243 76.0977 51.655 74.9761 52.9636C73.8544 54.2566 72.3199 55.7989 70.3726 57.5904L60.6049 66.4935L63.3156 61.7499V66.4935L60.6283 64.3203H78.5981V69.9286H54.0853Z" fill="white"/>
      </svg>
      `;

          marker.style.backgroundSize = "cover";
          marker.style.backgroundRepeat = "no-repeat";
          marker.style.backgroundPosition = "center";

          // 컨테이너에 마커와 라벨 추가
          markerContainer.appendChild(marker);

          // minimap에 컨테이너 추가
          minimap.appendChild(markerContainer);

          setMarkerSelected(true);

          const converted = convertCoordinates(
            x,
            y,
            background.offsetWidth,
            background.offsetHeight
          );
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        canvas.width = background.width;
        canvas.height = background.height;
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
      });

      // 로봇 데이터
      robotData();

      // 실시간으로 DB 지켜보기
      client
        .channel("room1")
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "robots",
          },
          (payload) => {
            robotData();
          }
        )
        .subscribe();

      // 로봇 상태
      let robotStatus = 0;
      // 로봇 마커 찍기
      async function robotData() {
        const robots = await getRobots();

        // 기존 마커 제거
        const markers = document.querySelectorAll(".robot_marker_container");
        markers.forEach((marker) => marker.remove());

        robots.forEach((robot) => {
          if (robot.id === parseInt(robotId)) {
            robotStatus = robot.status;
            const marker_container = createRobotMarker(
              robot,
              "minimap_gaussian",
              0
            );
            document
              .querySelector(".minimap_map")
              .appendChild(marker_container);
          }
        });
      }

      function openHome(page) {
        let url = page + ".html";
        window.location = url;
      }

      function goBack() {
        history.back();
      }

      function openPage() {
        // 로봇이 이미 사용중일 경우
        if (robotStatus === 1) {
          alert("이미 사용중인 로봇입니다. 로봇 선택 페이지로 이동합니다.");
          window.location.href = "selectrobot.html";
          return 0;
        }
        if (isMarkerSelected) {
          // 사람이 선택한 부분
          const {
            x: gaussianX,
            z: gaussianZ,
            model_num: model_num,
          } = convertToGaussian(selectedX, selectedY);

          const convertedCoordinates = {
            x: gaussianX,
            y: gaussianZ,
            model_num: model_num,
          };
          const coordData = {
            x: gaussianX,
            y: gaussianZ,
          };

          localStorage.setItem("destin", destin);
          localStorage.setItem("robot", robotId);

          localStorage.setItem(
            "selectedCoordinates",
            JSON.stringify(convertedCoordinates)
          );
          localStorage.setItem("clickedCoords", JSON.stringify([coordData]));
          const url = `gaussian.html`;
          window.location.href = url;
        }
      }

      // newton1.splat scaling
      // scaling, index(모델 인덱스)
      //      selectedX = (x * minimapRect.width) / 100 + 19;
      //     selectedY = (y * minimapRect.height) / 100 + 48;
      function convertToGaussian(x, y) {
        let model_num = -1;
        let gaussianX;
        let gaussianZ;

        console.log("2d : ", x, y);

        gaussianX = 0;
        gaussianZ = 0;
        // 인덱스 0
        if (x >= 82.51 && x <= 91.4553 && y >= 77.0424 && y <= 89.4141) {
          model_num = 0;
          gaussianX = -40.145 * x + 3349.587;
          gaussianZ = 34.244 * y + -2652.041;

          // 인덱스 1
        } else if (
          x >= 56.2083 &&
          x <= 81.5754 &&
          y >= 88.2894 &&
          y <= 91.6636
        ) {
          model_num = 1;
          gaussianX = -41.775 * x + 3499.309;
          gaussianZ = 39.479 * y + -3107.619;

          // 인덱스 2
        } else if (
          x >= 35.6475 &&
          x <= 55.8077 &&
          y >= 91.1012 &&
          y <= 93.7724
        ) {
          model_num = 2;
          gaussianX = -100.724 * x + 6450.991;
          gaussianZ = 30.022 * y + -2076.53;

          // 인덱스 3
        } else if (x >= 31.7 && x <= 34.2 && y >= 76.55 && y <= 94.3) {
          model_num = 3;
          gaussianX = -53.927 * x + 3743.21;
          gaussianZ = 45.414 * y + -3385.644;

          // 인덱스 4
        } else if (x >= 24.05 && x <= 33.6 && y >= 74.35 && y <= 75.7) {
          model_num = 4;
          gaussianX = -44.725 * x + 3470.419;
          gaussianZ = -74.848 * y + 5095.013;

          // 인덱스 5
        } else if (x >= 19.44 && x <= 24.9 && y >= 37.9 && y <= 73) {
          model_num = 5;
          gaussianX = -33.608 * x + 3264.911;
          gaussianZ = 30.348 * y + -2674.893;

          // 인덱스 6
        } else if (x >= 16.35 && x <= 20.5604 && y >= 13.5327 && y <= 37.6) {
          model_num = 6;
          gaussianX = -40.911 * x + 3434.542;
          gaussianZ = 37.845 * y + -2988.287;
        }
        console.log("계산 후 : ", gaussianX, gaussianZ);
        return { x: gaussianX, z: gaussianZ, model_num: model_num };
      }

      window.openHome = openHome;
      window.goBack = goBack;
      window.openPage = openPage;
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        background-color: rgba(248, 248, 248, 1);
      }

      .minimap_container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .minimap_title {
        text-align: center;
        width: 100%;
        background-color: white;
      }

      .minimap_check {
        text-align: center;
      }

      .minimap_check_btn {
        width: 300px;
        height: 80px;
        border-radius: 10px;
        font-size: large;
      }

      .minimap_map {
        display: flex;
        justify-content: center;

        position: relative;
        cursor: pointer;
      }

      #minimap_gaussian {
        height: 75vh;
      }

      /* 전체 모달 배경 */
      #selectdest_modal {
        display: flex;
        pointer-events: none; /* 클릭 무시 */
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: flex-end;
        z-index: 1000;
      }

      /* 모달 내용 */
      .selectdest_modal-content {
        pointer-events: auto;
        background-color: white;
        width: 100%;
        max-height: 50%;
        border-radius: 20px 20px 0 0;
        padding: 20px;
        /* animation: slideUp 0.4s ease-out; */
      }

      .complete_selection {
        width: 100%;
        border-radius: 40px;
        padding: 10px 20px;

        background-color: white;
        border: 1px solid rgba(63, 226, 244, 1);

        cursor: pointer;
      }
      .complete_selection:hover {
        background-color: rgba(63, 226, 244, 1);
        color: white;
        font-weight: bold;
      }

      .selectdest_modal_above {
        /* display: flex; */
        align-items: center;

        margin-bottom: 10px;
      }

      .selectdest_modal_title {
        font-size: 16px;
        color: #222222;

        display: flex;
        justify-content: center;
        align-items: center;
      }
      .selectdest_modal_detail {
        font-size: 12px;
        color: #222222;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 애니메이션 */
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 1000px) {
        #minimap_gaussian {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div id="header"></div>
    <div class="minimap_container">
      <!-- <div class="minimap_title">
      </div> -->
      <div class="minimap_map" id="minimap_map">
        <img
          id="minimap_gaussian"
          alt="gaussian_img"
          src="assets/images/Minimap.png"
        />
      </div>
    </div>

    <div class="minimap_check">
      <!-- <button class="minimap_check_btn" , type="button" , onclick="openPage()">
        선택 완료
      </button> -->
    </div>

    <div id="selectdest_modal">
      <div class="selectdest_modal-content">
        <div class="selectdest_modal_above">
          <div class="selectdest_modal_title" id="robot-info"></div>
          <div class="selectdest_modal_detail">
            지도를 움직여 위치를 지정하세요.
          </div>
        </div>
        <button
          class="complete_selection"
          ,
          type="button"
          ,
          onclick="openPage()"
        >
          선택 완료
        </button>
      </div>
    </div>
    <canvas id="colorCanvas" style="display: none"></canvas>
    <script type="module">
      import {
        insertRequest,
        getRobots,
        client,
      } from "./supaDatabase/connectDatabase.js";

      // const params = new URLSearchParams(window.location.search);
      // const destin = params.get("destin"); // 출발지인지 목적지인지. 0 : 출발지, 1 : 목적지
      // const robotId = params.get("robot"); // 선택된 로봇 번호
      const destin = localStorage.getItem("destin"); // 출발지인지 목적지인지. 0 : 출발지, 1 : 목적지
      const robotId = localStorage.getItem("robot"); // 로봇 번호

      // 제목 설정
      const titleElement = document.getElementById("robot-info");
      if (destin === "0") {
        titleElement.textContent = "첫 번째 목적지를 선택해주세요.";
      } else if (destin === "1") {
        titleElement.textContent = "두 번째 목적지를 선택해주세요.";
      }

      // 출발지 마커
      if (destin == 1) {
        // 목적지를 찍는 페이지라면 ...
        document.addEventListener("DOMContentLoaded", () => {
          // marker와 label을 넣는 container
          const start = document.createElement("div");
          const startCoordin = JSON.parse(localStorage.getItem("start"));
          start.className = "minimap_start";
          start.style.position = "absolute";
          start.style.top = startCoordin.top + "%";
          start.style.left = startCoordin.left + "%";
          start.style.display = "flex";
          start.style.alignItems = "flex-start";

          // marker
          const startMarker = document.createElement("div");
          startMarker.style.width = "27px";
          startMarker.style.height = "34px";
          startMarker.style.backgroundImage = "url('assets/images/firstDestination.png')";
          startMarker.style.backgroundSize = "cover";
          startMarker.style.backgroundRepeat = "no-repeat";
          startMarker.style.backgroundPosition = "center";
          // startMarker.style.borderRadius = "50%";
          // startMarker.style.backgroundColor = "rgb(0, 217, 255)";

          // label
          const startLabel = document.createElement("span");
          // startLabel.innerHTML = `출발지`;
          // startLabel.style.fontSize = "14px";
          // startLabel.style.color = "rgb(0, 217, 255)";

          start.appendChild(startMarker);
          start.appendChild(startLabel);
          document.querySelector(".minimap_map").appendChild(start);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetch("header.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          })
          .catch((error) => console.error("Error loading header:", error));
      });

      function convertCoordinates(x, y, width, height) {
        // 이미지 상의 클릭 범위를 기준으로 실제 좌표를 계산
        const leftTop = { x: -410, y: 212 }; // 좌측 상단
        const rightBottom = { x: 485, y: -512 }; // 우측 하단

        // 화면 기준 X, Y를 0~1로 정규화 (이미지의 크기를 기준으로 비율을 계산)
        // const normalizedX = x / width; // 화면의 X 좌표를 0 ~ 1로 정규화
        // const normalizedY = y / height; // 화면의 Y 좌표를 0 ~ 1로 정규화

        const miniMapWidth = window.innerWidth;
        const miniMapHeight = window.innerHeight;

        // 미니맵의 X, Y 좌표를 0 ~ 1로 정규화
        const normalizedX = x / miniMapWidth;
        const normalizedY = y / miniMapHeight;

        // const worldX = leftTop.x + normalizedX * (rightBottom.x - leftTop.x);
        // const worldY = leftTop.y + normalizedY * (rightBottom.y - leftTop.y);
        const worldX = leftTop.x + normalizedX * (rightBottom.x - leftTop.x);
        const worldY = leftTop.y + normalizedY * (rightBottom.y - leftTop.y);

        // 소수점 두 자리까지 반환
        return { x: worldX.toFixed(6), y: worldY.toFixed(6) };
      }

      let isMarkerSelected = null;

      function setMarkerSelected(isSelected) {
        isMarkerSelected = isSelected;
      }

      const minimap = document.getElementById("minimap_map");
      const background = document.getElementById("minimap_gaussian");
      const canvas = document.getElementById("colorCanvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      // let marker = null;

      // 마커, 라벨 저장할 변수
      let markerContainer = null;

      background.addEventListener("load", () => {
        canvas.width = background.width;
        canvas.height = background.height;
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
      });

      let selectedX = null;
      let selectedY = null;

      let robotX = null;
      let robotY = null;

      // 클릭한 부분
      minimap.addEventListener("click", (event) => {
        // 미니맵의 정보
        const minimapRect = minimap.getBoundingClientRect();

        // 이미지에서 클릭한 부분을 %로 좌표 표현 (marker)
        // 왼쪽 위를 원점
        const x =
          (100 * (event.clientX - minimapRect.left - 19)) / minimapRect.width;
        const y =
          (100 * (event.clientY - minimapRect.top - 48)) / minimapRect.height;

        // 클릭한 위치의 색 가져오기
        const pixelData = ctx.getImageData(
          (x * minimapRect.width) / 100 + 19,
          (y * minimapRect.height) / 100 + 48,
          1,
          1
        ).data;

        const color = `rgb(${pixelData[0]}, ${pixelData[1]}, ${pixelData[2]})`;
        console.log(color);
        if (color === "rgb(208, 230, 246)") {
          if (markerContainer) {
            minimap.removeChild(markerContainer);
          }

          // 사람이 선택한 부분
          selectedX = x;
          selectedY = y;

          // a, b는 클릭한 부분을 로봇 좌표로 변경한 것 (지도의 빨간 1px짜리가 원점)
          // 사용자는 왼쪽 위가 원점
          robotX =
            (((100 * (event.clientX - minimapRect.left)) / minimapRect.width -
              (2750 * 100) / 3299) *
              3299) /
            100;

          robotY =
            (((2457 * 100) / 3133 -
              (100 * (event.clientY - minimapRect.top)) / minimapRect.height) *
              3133) /
            100;

          // console.log("x", x, "y", y);

          let model_index = 0; // 기본값 (해당 없음)

          // 인덱스 0
          if (x >= 82.46 && x <= 90.73 && y >= 76.04 && y <= 88.64) {
            model_index = 0;

            // 인덱스 1
          } else if (x >= 55.5 && x <= 83.11 && y >= 87.26 && y <= 90.93) {
            model_index = 1;

            // 인덱스 2
          } else if (x >= 37.34 && x <= 56.15 && y >= 89.67 && y <= 92.87) {
            model_index = 2;

            // 인덱스 3
          } else if (x >= 31.03 && x <= 37.77 && y >= 75.81 && y <= 92.87) {
            model_index = 3;

            // 인덱스 4
          } else if (x >= 23.64 && x <= 32.88 && y >= 73.18 && y <= 75.47) {
            model_index = 4;

            // 인덱스 5
          } else if (x >= 18.75 && x <= 24.4 && y >= 36.55 && y <= 73.75) {
            model_index = 5;

            // 인덱스 6
          } else if (x >= 15.81 && x <= 20.16 && y >= 12.73 && y <= 37.0) {
            model_index = 6;
          }

          console.log("x", x, "y", y, "모델 인덱스 : ", model_index);

          // 마커와 라벨을 감싸는 컨테이너 생성
          markerContainer = document.createElement("div");
          markerContainer.style.position = "absolute";
          markerContainer.style.top = `${y}%`;
          markerContainer.style.left = `${x}%`;
          markerContainer.style.display = "flex";
          markerContainer.style.alignItems = "flex-start";

          // 마커 생성
          const marker = document.createElement("div");
          marker.style.width = "38px";
          marker.style.height = "48px";
          marker.style.backgroundImage = destin === "0" ? "url('assets/images/firstDestination.png')" : "url('assets/images/secondDestination.png')";
            // "url('assets/images/firstDestination.png')";
          marker.style.backgroundSize = "cover";
          marker.style.backgroundRepeat = "no-repeat";
          marker.style.backgroundPosition = "center";
          // marker.style.backgroundColor = "red";
          // marker.style.borderRadius = "50%";

          // 라벨 생성
          const markerLabel = document.createElement("span");
          // markerLabel.textContent = destin === "0" ? "출발지" : "목적지";
          // markerLabel.style.marginLeft = "10px"; // 마커 오른쪽에
          // markerLabel.style.color = "red";
          // markerLabel.style.fontSize = "14px";
          // markerLabel.style.fontWeight = "bold";

          // 컨테이너에 마커와 라벨 추가
          markerContainer.appendChild(marker);
          markerContainer.appendChild(markerLabel);

          // minimap에 컨테이너 추가
          minimap.appendChild(markerContainer);

          setMarkerSelected(true);

          const converted = convertCoordinates(
            x,
            y,
            background.offsetWidth,
            background.offsetHeight
          );
        }
      });

      function isClickInside(event, element) {
        const rect = element.getBoundingClientRect();
        return (
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom
        );
      }

      document.addEventListener("DOMContentLoaded", () => {
        canvas.width = background.width;
        canvas.height = background.height;
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
      });

      // 로봇 데이터
      robotData();

      // 실시간으로 DB 지켜보기
      client
        .channel("room1")
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "robots",
          },
          (payload) => {
            robotData();
          }
        )
        .subscribe();

      // 로봇 상태
      let robotStatus = 0;
      // 로봇 마커 찍기
      async function robotData() {
        const robots = await getRobots();

        // 기존 마커 제거
        const markers = document.querySelectorAll(".robot_marker_container");
        markers.forEach((marker) => marker.remove());

        robots.forEach((robot) => {
          if (robot.id === parseInt(robotId)) {
            robotStatus = robot.status;
            const marker_container = createRobotMarker(
              robot,
              "minimap_gaussian",
              0
            );
            document
              .querySelector(".minimap_map")
              .appendChild(marker_container);
          }
        });
      }

      function openHome(page) {
        let url = page + ".html";
        window.location = url;
      }

      function goBack() {
        history.back();
      }

      function openPage() {
        // 로봇이 이미 사용중일 경우
        if (robotStatus === 1) {
          alert("이미 사용중인 로봇입니다. 로봇 선택 페이지로 이동합니다.");
          window.location.href = "selectrobot.html";
          return 0;
        }
        if (isMarkerSelected) {
          // 사람이 선택한 부분
          const markerTop = selectedY;
          const markerLeft = selectedX;
          const {
            x: gaussianX,
            z: gaussianZ,
            model_num: model_num,
          } = convertToGaussian(selectedX, selectedY);
          const convertedCoordinates = {
            x: gaussianX,
            y: gaussianZ,
            model_num: model_num,
          };

          const destin = localStorage.getItem("destin");
          localStorage.setItem("destin", destin);
          localStorage.setItem("robot", robotId);
          localStorage.setItem("top", markerTop);
          localStorage.setItem("left", markerLeft);
          localStorage.setItem(
            destin === "0" ? "robotStart" : "robotEnd",
            JSON.stringify({ robotX, robotY })
          );

          localStorage.setItem(
            "selectedCoordinates",
            JSON.stringify(convertedCoordinates)
          );
          const url = `gaussian.html`;
          window.location.href = url;
          // window.location.href = `gaussian.html?destin=${destin}&robot=${robotId}&top=${markerTop}&left=${markerLeft}`;
        }
      }

      // newton1.splat scaling
      // scaling, index(모델 인덱스)
      function convertToGaussian(x, y) {
        let model_num = 0;
        let gaussianX;
        let gaussianZ;

        gaussianX = -20.532 * x + 2942.919;
        gaussianZ = 39.563 * y + -3147.322;
        // 인덱스 0
        if (x >= 82.46 && x <= 90.73 && y >= 76.04 && y <= 88.64) {
          model_num = 0;
          gaussianX = -41.165 * x + 3407.058;
          gaussianZ = 39.684 * y + -3087.733;

          // 인덱스 1
        } else if (x >= 55.5 && x <= 83.11 && y >= 87.26 && y <= 90.93) {
          model_num = 1;
          gaussianX = -45.964 * x + 3779.558;
          gaussianZ = 39.799 * y + -3126.132;

          // 인덱스 2
        } else if (x >= 37.34 && x <= 56.15 && y >= 89.67 && y <= 92.87) {
          model_num = 2;
          gaussianX = -39.981 * x + 3349.914;
          gaussianZ = 38.273 * y + -2980.471;
          // 인덱스 3
        } else if (x >= 26.0 && x <= 38.0 && y >= 75.81 && y <= 94.42) {
          model_num = 3;
          gaussianX = -63.47 * x + 4146.684;
          gaussianZ = 42.176 * y + -3318.681;

          // 인덱스 4
        } else if (x >= 23.64 && x <= 32.88 && y >= 73.18 && y <= 75.47) {
          model_num = 4;
          gaussianX = -41.165 * x + 3407.058;
          gaussianZ = 39.684 * y + -3087.733;

          // 인덱스 5
        } else if (x >= 18.75 && x <= 24.4 && y >= 36.55 && y <= 73.75) {
          model_num = 5;
          gaussianX = -20.532 * x + 2942.919;
          gaussianZ = 39.563 * y + -3147.322;

          // 인덱스 6
        } else if (x >= 15.81 && x <= 20.16 && y >= 12.73 && y <= 37.0) {
          model_num = 6;
          gaussianX = -44.077 * x + 3470.849;
          gaussianZ = 44.223 * y + -3142.578;
        }

        return { x: gaussianX, z: gaussianZ, model_num: model_num };
      }

      window.openHome = openHome;
      window.goBack = goBack;
      window.openPage = openPage;
    </script>
  </body>
</html>

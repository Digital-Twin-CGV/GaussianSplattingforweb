<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>3D Gaussian Splat Viewer</title>
    <style>
      body {
        margin: 0;
        background-color: black;
      }

      .minimap_container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .minimap_robot {
        position: absolute;
        display: flex;
      }

      .minimap_title {
        text-align: center;
        width: 100%;
        background-color: white;
      }

      .minimap_landmark_btn {
        z-index: 10;
        border-radius: 20px;
        width: 30px;
        height: 30px;
      }

      .minimap_landmark_btn.selected {
        background-color: yellow;
      }

      .minimap_check {
        text-align: center;
      }

      .minimap_check_btn {
        width: 300px;
        height: 80px;
        border-radius: 10px;
        font-size: large;
      }

      .minimap_map {
        display: flex;
        justify-content: center;

        position: relative;
        cursor: pointer;
      }

      #minimap_gaussian {
        height: 80vh;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 600px) {
        #minimap_gaussian {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div id="header"></div>
    <div class="minimap_container">
      <div class="minimap_title">
        <h1 id="robot-info"></h1>
      </div>
      <div class="minimap_map" id="minimap_map">
        <img
          id="minimap_gaussian"
          alt="gaussian_img"
          src="assets/images/2dmap.png"
        />

        <!-- 선택된 로봇 위치 -->
        <div class="minimap_robot">
          <div class="minimap_robot_marker"></div>
          <div class="minimap_robot_label"></div>
        </div>
      </div>

      <div class="minimap_check">
        <button
          class="minimap_check_btn"
          ,
          type="button"
          ,
          onclick="openPage()"
        >
          선택 완료
        </button>
      </div>
    </div>
    <canvas id="colorCanvas" style="display: none"></canvas>
    <script type="module">
      import {
        insertRequest,
        getRobots,
        client,
      } from "./supaDatabase/connectDatabase.js";

      const params = new URLSearchParams(window.location.search);
      const destin = params.get("destin"); // 출발지인지 목적지인지. 0 : 출발지, 1 : 목적지
      const robotId = params.get("robot"); // 선택된 로봇 번호

      // 제목 설정
      const titleElement = document.getElementById("robot-info");
      if (destin === "0") {
        titleElement.textContent = "출발지를 선택해주세요";
      } else if (destin === "1") {
        titleElement.textContent = "목적지를 선택해주세요";
      }

      // 출발지 마커
      if (destin == 1) {
        // 목적지를 찍는 페이지라면 ...
        document.addEventListener("DOMContentLoaded", () => {
          // marker와 label을 넣는 container
          const start = document.createElement("div");
          const startCoordin = JSON.parse(localStorage.getItem("start"));
          start.className = "minimap_start";
          start.style.position = "absolute";
          start.style.top = startCoordin.top + "%";
          start.style.left = startCoordin.left + "%";
          start.style.display = "flex";
          start.style.alignItems = "flex-start";

          // marker
          const startMarker = document.createElement("div");
          startMarker.style.width = "10px";
          startMarker.style.height = "10px";
          startMarker.style.borderRadius = "50%";
          startMarker.style.backgroundColor = "rgb(0, 217, 255)";

          // label
          const startLabel = document.createElement("span");
          startLabel.innerHTML = `출발지`;
          startLabel.style.fontSize = "14px";
          startLabel.style.color = "rgb(0, 217, 255)";

          start.appendChild(startMarker);
          start.appendChild(startLabel);
          document.querySelector(".minimap_map").appendChild(start);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetch("header.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          })
          .catch((error) => console.error("Error loading header:", error));
      });

      function convertCoordinates(x, y, width, height) {
        // 이미지 상의 클릭 범위를 기준으로 실제 좌표를 계산
        const leftTop = { x: -410, y: 212 }; // 좌측 상단
        const rightBottom = { x: 485, y: -512 }; // 우측 하단

        // 화면 기준 X, Y를 0~1로 정규화 (이미지의 크기를 기준으로 비율을 계산)
        // const normalizedX = x / width; // 화면의 X 좌표를 0 ~ 1로 정규화
        // const normalizedY = y / height; // 화면의 Y 좌표를 0 ~ 1로 정규화

        const miniMapWidth = window.innerWidth;
        const miniMapHeight = window.innerHeight;

        // 미니맵의 X, Y 좌표를 0 ~ 1로 정규화
        const normalizedX = x / miniMapWidth;
        const normalizedY = y / miniMapHeight;

        // const worldX = leftTop.x + normalizedX * (rightBottom.x - leftTop.x);
        // const worldY = leftTop.y + normalizedY * (rightBottom.y - leftTop.y);
        const worldX = leftTop.x + normalizedX * (rightBottom.x - leftTop.x);
        const worldY = leftTop.y + normalizedY * (rightBottom.y - leftTop.y);

        // 소수점 두 자리까지 반환
        return { x: worldX.toFixed(6), y: worldY.toFixed(6) };
      }

      let isMarkerSelected = null;

      function setMarkerSelected(isSelected) {
        isMarkerSelected = isSelected;
      }

      const minimap = document.getElementById("minimap_map");
      const background = document.getElementById("minimap_gaussian");
      const canvas = document.getElementById("colorCanvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      // let marker = null;

      // 마커, 라벨 저장할 변수
      let markerContainer = null;

      background.addEventListener("load", () => {
        canvas.width = background.width;
        canvas.height = background.height;
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
      });

      let selectedX = null;
      let selectedY = null;

      let robotX = null;
      let robotY = null;

      // 클릭한 부분
      minimap.addEventListener("click", (event) => {
        // 미니맵의 정보
        const minimapRect = minimap.getBoundingClientRect();

        // 이미지에서 클릭한 부분을 %로 좌표 표현 (marker)
        // 왼쪽 위를 원점
        const x =
          (100 * (event.clientX - minimapRect.left - 5)) / minimapRect.width;
        const y =
          (100 * (event.clientY - minimapRect.top - 5)) / minimapRect.height;

        // 사람이 선택한 부분
        selectedX = x;
        selectedY = y;

        // a, b는 클릭한 부분을 로봇 좌표로 변경한 것 (지도의 빨간 1px짜리가 원점)
        // 사용자는 왼쪽 위가 원점
        robotX =
          (((100 * (event.clientX - minimapRect.left)) / minimapRect.width -
            (2750 * 100) / 3299) *
            3299) /
          100;

        robotY =
          (((2457 * 100) / 3133 -
            (100 * (event.clientY - minimapRect.top)) / minimapRect.height) *
            3133) /
          100;

        // console.log("x", x, "y", y);

        let model_index = 0; // 기본값 (해당 없음)

        if (x >= 68.3 && x <= 80.8 && y >= 77.1 && y <= 89.9) {
          model_index = 1;
        } else if (x >= 42.6 && x < 68.3 && y > 87.5 && y <= 92.4) {
          model_index = 2;
        } else if (
          (x >= 22.1 && x <= 42.1 && y >= 90.5 && y <= 94.3) ||
          (x >= 19.1 && x < 42.6 && y > 92.4 && y <= 94.9)
        ) {
          model_index = 3;
        } else if (
          (x >= 15.9 && x <= 20.7 && y >= 78.1 && y <= 94.7) ||
          (x >= 13.8 && x < 19.1 && y >= 78.5 && y < 94.9)
        ) {
          model_index = 4;
        } else if (
          (x >= 8.7 && x <= 13.5 && y >= 60.2 && y <= 80.1) ||
          (x >= 7.5 && x < 13.8 && y >= 70.6 && y < 78.5)
        ) {
          model_index = 5;
        } else if (
          (x >= 4.4 && x <= 10.4 && y >= 22.1 && y <= 60.6) ||
          (x >= 6.0 && x < 12.0 && y >= 48.6 && y < 69.9)
        ) {
          model_index = 6;
        }

        console.log("x", x, "y", y, "모델 인덱스 : ", model_index);

        const landmarkButton = document.querySelectorAll(
          ".minimap_landmark_btn"
        );

        // 클릭한 위치의 색 가져오기
        const pixelData = ctx.getImageData(
          (x * minimapRect.width) / 100 + 10,
          (y * minimapRect.height) / 100 + 10,
          1,
          1
        ).data;
        const color = `rgb(${pixelData[0]}, ${pixelData[1]}, ${pixelData[2]})`;
        console.log(color);
        if (color !== "rgb(0, 0, 0)") {
          // if (marker) {
          //   minimap.removeChild(marker);
          // }

          if (markerContainer) {
            minimap.removeChild(markerContainer);
          }

          // 마커와 라벨을 감싸는 컨테이너 생성
          markerContainer = document.createElement("div");
          markerContainer.style.position = "absolute";
          markerContainer.style.top = `${y}%`;
          markerContainer.style.left = `${x}%`;
          markerContainer.style.display = "flex";
          markerContainer.style.alignItems = "flex-start";

          // 마커 생성
          const marker = document.createElement("div");
          marker.style.width = "10px";
          marker.style.height = "10px";
          marker.style.backgroundColor = "red";
          marker.style.borderRadius = "50%";

          // 라벨 생성
          const markerLabel = document.createElement("span");
          markerLabel.textContent = destin === "0" ? "출발지" : "목적지";
          markerLabel.style.marginLeft = "10px"; // 마커 오른쪽에
          markerLabel.style.color = "red";
          markerLabel.style.fontSize = "14px";
          markerLabel.style.fontWeight = "bold";

          // 컨테이너에 마커와 라벨 추가
          markerContainer.appendChild(marker);
          markerContainer.appendChild(markerLabel);

          // minimap에 컨테이너 추가
          minimap.appendChild(markerContainer);

          setMarkerSelected(true);

          const converted = convertCoordinates(
            x,
            y,
            background.offsetWidth,
            background.offsetHeight
          );
        }
      });

      function isClickInside(event, element) {
        const rect = element.getBoundingClientRect();
        return (
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom
        );
      }

      let selectedLandmarkButton = null;
      function toggleLandmarkSelection(button) {
        if (selectedLandmarkButton && selectedLandmarkButton !== button) {
          selectedLandmarkButton.classList.remove("selected");
        }

        if (marker) {
          minimap.removeChild(marker);
          marker = null;
        }
        // 현재 버튼을 선택/해제
        if (button.classList.contains("selected")) {
          button.classList.remove("selected");
          selectedLandmarkButton = null; // 선택 해제
        } else {
          button.classList.add("selected");
          selectedLandmarkButton = button; // 새로 선택한 버튼 저장
        }

        setLandmarkSelected(selectedLandmarkButton !== null); // 선택된 랜드마크가 있으면 true, 없으면 false
        setMarkerSelected(false); // 마커는 선택되지 않음
      }

      document.addEventListener("DOMContentLoaded", () => {
        canvas.width = background.width;
        canvas.height = background.height;
        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
      });

      // 로봇 데이터
      robotData();

      // 실시간으로 DB 지켜보기
      client
        .channel("room1")
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "robots",
          },
          (payload) => {
            robotData();
          }
        )
        .subscribe();

      // 로봇 마커 찍기
      async function robotData() {
        const robots = await getRobots();
        const robotContainer = document.querySelector(`.minimap_robot`);
        const robotMarker = document.querySelector(`.minimap_robot_marker`);
        const robotLabel = document.querySelector(`.minimap_robot_label`);

        robots.forEach((robot) => {
          if (robot.id === parseInt(robotId)) {
            // 미니맵의 정보
            const minimapRect = document
              .getElementById("minimap_gaussian")
              .getBoundingClientRect();
            // robot marker와 label을 담을 container
            robotContainer.style.left =
              ((robot.position[0] + 2750) * 100) / 3299 -
              (5 * 100) / minimapRect.width +
              "%";
            robotContainer.style.top =
              ((-robot.position[1] + 2457) * 100) / 3133 -
              (5 * 100) / minimapRect.height +
              "%";
            robotContainer.style.display = "flex";
            robotContainer.style.alignItems = "flex-start";

            // robot marker
            robotMarker.style.width = "10px";
            robotMarker.style.height = "10px";
            robotMarker.style.borderRadius = "50%";
            robotMarker.style.backgroundColor = "#1dd200";

            // robot label
            robotLabel.innerHTML = `로봇${robot.id}`;
            robotLabel.style.color = "#1dd200";
            robotLabel.style.fontSize = "10px";
            robotLabel.style.marginLeft = "5px";
          }
        });
      }

      function openHome(page) {
        let url = page + ".html";
        window.location = url;
      }

      function goBack() {
        history.back();
      }

      function openPage() {
        if (isMarkerSelected) {
          // 사람이 선택한 부분
          const markerTop = selectedY;
          const markerLeft = selectedX;
          const {
            x: gaussianX,
            z: gaussianZ,
            model_num: model_num,
          } = convertToGaussian(selectedX, selectedY);
          const convertedCoordinates = {
            x: gaussianX,
            y: gaussianZ,
            model_num: model_num,
          };

          localStorage.setItem(
            destin === "0" ? "robotStart" : "robotEnd",
            JSON.stringify({ robotX, robotY })
          );

          localStorage.setItem(
            "selectedCoordinates",
            JSON.stringify(convertedCoordinates)
          );
          window.location.href = `gaussian.html?destin=${destin}&robot=${robotId}&top=${markerTop}&left=${markerLeft}`;
        }
      }

      // newton1.splat scaling
      // scaling, index(모델 인덱스)
      function convertToGaussian(x, y) {
        let model_index = 0;
        const gaussianX = -34.875 * x + 2521.328;
        const gaussianZ = 29.43 * y + -2241.936;
        if (x >= 68.3 && x <= 80.8 && y >= 77.1 && y <= 89.9) {
          model_index = 1;
        } else if (x >= 42.6 && x < 68.3 && y > 87.5 && y <= 92.4) {
          model_index = 2;
        } else if (
          (x >= 22.1 && x <= 42.1 && y >= 90.5 && y <= 94.3) ||
          (x >= 19.1 && x < 42.6 && y > 92.4 && y <= 94.9)
        ) {
          model_index = 3;
        } else if (
          (x >= 15.9 && x <= 20.7 && y >= 78.1 && y <= 94.7) ||
          (x >= 13.8 && x < 19.1 && y >= 78.5 && y < 94.9)
        ) {
          model_index = 4;
        } else if (
          (x >= 8.7 && x <= 13.5 && y >= 60.2 && y <= 80.1) ||
          (x >= 7.5 && x < 13.8 && y >= 70.6 && y < 78.5)
        ) {
          model_index = 5;
        } else if (
          (x >= 4.4 && x <= 10.4 && y >= 22.1 && y <= 60.6) ||
          (x >= 6.0 && x < 12.0 && y >= 48.6 && y < 69.9)
        ) {
          model_index = 6;
        }
        return { x: gaussianX, z: gaussianZ, model_num: model_index };
      }

      window.openHome = openHome;
      window.goBack = goBack;
      window.openPage = openPage;
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <style>
      body {
        margin: 0;
      }
      .main_container {
        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .logo {
        padding-bottom: 137px;
      }
      .main_large-button {
        width: 353px;
        height: 56px;

        border: 2px solid #3FE2F4;
        border-radius: 50px;
        color: black;
        background-color: transparent ;

        text-align: center;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      .main_manager {
        position: absolute; /* 위치 설정 */
        bottom: 30px;
        right: 30px;

        font-size: 25px;
        border: none;
        border-radius: 10px;
        padding: 20px 40px;
        background-color: #d9d9d9;

        cursor: pointer;
      }

      .mobile-message {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 30px;
        text-align: center;
      }

      /* 반응형 */
      @media screen and (max-width: 1000px) {
        .main_large-button {
          /* padding-left: 40px;
          padding-right: 40px; */
          font-size: 16px; /* 작은 화면에서 글씨 크기 줄이기 */
        }

        .main_manager {
          font-size: 16px; /* 작은 화면에서 글씨 크기 줄이기 */
          padding: 20px 30px;
        }
      }
    </style>
  </head>

  <body>
    <div class="main_container">
      <div class="logo" id="logo">
        <svg width="207" height="71" viewBox="0 0 207 71" fill="none" xmlns="http://www.w3.org/2000/svg">

        </svg>
      </div>
      <div class="buttons" id="buttons">
        <button class="main_large-button" onclick="openDemo('selectrobot')">
          시작하기
        </button>
        <!-- <button class="main_manager" onclick="openDemo('manage')">
          관리자 모드
        </button> -->
      </div>
    </div>

    <script>
      let clickCount = 0;
      const logoElement = document.getElementById("logo");

      if(logoElement) {
        logoElement.addEventListener("click", function() {
          clickCount++;
          if (clickCount === 5) {
            alert("관리자 모드로 전환합니다.");
            window.location.href = "manage.html";
          }
        });
      }
      
      function openDemo(page) {
        // 창 넘어가는 함수
        let url;
        url = page + ".html";

        window.location = url;
      }
    </script>
  </body>
</html>

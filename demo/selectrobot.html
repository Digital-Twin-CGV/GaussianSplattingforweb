<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        background-color: rgba(248, 248, 248, 1);
      }

      .selectrobot_container {
        display: flex;
        flex-direction: column;
        align-items: center;

        width: 100%;
      }

      .selectrobot_modal_robot_name {
        color: #222222;
        font-size: 22px;
        font-weight: bold;
      }
      .selectrobot_modal_robot_battery {
        color: #222222;
        font-size: 16px;
        margin-top: 5px;
      }

      /*.selectrobot_zoom_btns {
        position: absolute;
        right: 10px;
        bottom: 10px;
      }

      .selectrobot_zoom {
        color: #c0c0c0;
        border: 1px solid #c0c0c0;
        padding: 5px;
      }*/

      .selectrobot_check_btn {
        position: fixed;
        width: 80%;
        height: 40px;
        border-radius: 10px;
        bottom: 20px;
        padding: 0 15px;

        background-color: white;
        color: rgba(164, 164, 164, 1);
        border: none;

        display: flex;
        align-items: center;
        justify-content: flex-start;

        box-shadow: 0px 0px 8.9px 2px rgba(0, 0, 0, 0.04);
      }

      .selectrobot_map {
        display: flex;
        justify-content: center;

        position: relative;
      }

      #selectrobot_gaussian {
        height: 75vh;
      }

      /* 전체 모달 배경 */
      #selectrobot_modal {
        display: none; /* 초기에는 숨김 */
        pointer-events: none; /* 클릭 무시 */
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: flex-end;
        z-index: 1000;
      }

      /* 모달 내용 */
      .selectrobot_modal-content {
        pointer-events: auto;
        background-color: white;
        width: 100%;
        max-height: 50%;
        border-radius: 28px 28px 0 0;
        padding: 20px;
        padding-top: 10px;
        animation: slideUp 0.4s ease-out;
      }

      .modal-line {
        width: 40px;
        border: 2px solid #bbbbbb;
        border-radius: 10px;
        margin-bottom: 32px;
      }

      .selectrobot_modal_selectbtn {
        width: 100%;
        border-radius: 40px;
        padding: 15px 20px;
        margin-bottom: 30px;

        background-color: white;
        border: 1px solid rgba(63, 226, 244, 1);

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
      }

      .selectrobot_modal_above {
        display: flex;
        align-items: center;

        margin-bottom: 10px;
      }

      /* 애니메이션 */
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 1000px) {
        #selectrobot_gaussian {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div id="header"></div>

    <div class="selectrobot_container">
      <div class="selectrobot_map" id="selectrobot_map">
        <!-- <div class="selectrobot_zoom_btns">
          <div class="selectrobot_zoom" id="selectrobot_zoom_in">+</div>
          <div class="selectrobot_zoom" id="selectrobot_zoom_out">-</div>
        </div> -->
        <img
          id="selectrobot_gaussian"
          alt="gaussian_img"
          src="assets/images/Minimap.png"
        />
      </div>

      <div class="selectrobot_check_btn" type="button">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          style="margin-right: 10px"
        >
          <!-- 물음표 svg -->
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M2 12.0015C2 6.47862 6.47715 2.00146 12 2.00146C17.5228 2.00146 22 6.47862 22 12.0015C22 17.5243 17.5228 22.0015 12 22.0015C6.47715 22.0015 2 17.5243 2 12.0015ZM12 3.3348C7.21353 3.3348 3.33333 7.215 3.33333 12.0015C3.33333 16.7879 7.21353 20.6681 12 20.6681C16.7865 20.6681 20.6667 16.7879 20.6667 12.0015C20.6667 7.215 16.7865 3.3348 12 3.3348Z"
            fill="#A4A4A4"
          />
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M14.2133 8.21098C14.8352 8.78328 15.2032 9.63168 15.0744 10.6537C14.9415 11.7091 14.1594 12.2455 13.6193 12.6159C13.5779 12.6443 13.5379 12.6717 13.4997 12.6983C12.9098 13.1096 12.5896 13.395 12.5896 14.0015C12.5896 14.3328 12.3209 14.6015 11.9896 14.6015C11.6582 14.6015 11.3896 14.3328 11.3896 14.0015C11.3896 12.7366 12.2104 12.1344 12.8134 11.714L12.823 11.7072C13.4739 11.2535 13.8198 11.0123 13.8838 10.5038C13.9626 9.87846 13.7456 9.41136 13.4007 9.094C13.0414 8.76341 12.5252 8.58155 12.015 8.60319C10.9532 8.64824 10.1 9.45682 10.1 10.4028C10.1 10.7342 9.83137 11.0028 9.5 11.0028C9.16863 11.0028 8.9 10.7342 8.9 10.4028C8.9 8.69383 10.387 7.47118 11.9641 7.40427C12.7734 7.36994 13.6057 7.65191 14.2133 8.21098Z"
            fill="#A4A4A4"
          />
          <path
            d="M12.8002 16.4016C12.8002 16.8434 12.442 17.2016 12.0002 17.2016C11.5584 17.2016 11.2002 16.8434 11.2002 16.4016C11.2002 15.9597 11.5584 15.6016 12.0002 15.6016C12.442 15.6016 12.8002 15.9597 12.8002 16.4016Z"
            fill="#A4A4A4"
          />
        </svg>
        <div style="margin-bottom: 3px">사용할 로봇을 선택해 주세요</div>
      </div>
    </div>

    <div id="selectrobot_modal">
      <div class="selectrobot_modal-content">
        <hr class="modal-line" />
        <div class="selectrobot_modal_above">
          <img
            class="selectrobot_modal_robot"
            src="assets/images/robot_photo.png"
          />
          <div class="selectrobot_modal_right">
            <div class="selectrobot_modal_robot_name"></div>
            <div class="selectrobot_modal_robot_battery"></div>
          </div>
        </div>
        <button class="selectrobot_modal_selectbtn">로봇 선택하기</button>
      </div>
    </div>
    <script>
      // 헤더에 필요한 script
      document.addEventListener("DOMContentLoaded", () => {
        fetch("header.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          })
          .catch((error) => console.error("Error loading header:", error));
      });

      function openHome(page) {
        let url = page + ".html";
        window.location = url;
      }

      function goBack() {
        history.back();
      }
    </script>
    <script type="module">
      import { getRobots, client } from "./supaDatabase/connectDatabase.js";

      document.addEventListener("DOMContentLoaded", () => {
        document
          .querySelector(".selectrobot_modal_selectbtn")
          .addEventListener("click", () => openDemo("minimap"));
      });

      // 로봇 데이터
      robotData();

      // 실시간으로 DB 지켜보기
      client
        .channel("room1")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "robots" },
          (payload) => {
            robotData();
          }
        )
        .subscribe();

      // 로봇 데이터 가져오기
      async function robotData() {
        const robots = await getRobots();

        // 기존 마커 제거
        const markers = document.querySelectorAll(".robot_marker_container");
        markers.forEach((marker) => marker.remove());

        robots.forEach((robot) => {
          const marker_container = createRobotMarker(
            robot,
            "selectrobot_gaussian",
            selectedRobot
          );
          marker_container.style.cursor = "pointer";
          document
            .querySelector(".selectrobot_map")
            .appendChild(marker_container);

          marker_container.addEventListener("click", () => {
            updateSelection(robot.id, robot.status, robot.battery);
          });
        });
      }

      // 선택된 로봇 번호, 선택된 로봇의 상태
      let selectedRobot = null;
      let selectedAvailable = null;

      const modal = document.getElementById("selectrobot_modal");
      const robotId = document.querySelector(".selectrobot_modal_robot_name");
      const robotBattery = document.querySelector(
        ".selectrobot_modal_robot_battery"
      );
      function updateSelection(robotName, available, battery) {
        selectedRobot = robotName;
        selectedAvailable = available;

        modal.style.display = "flex";
        robotId.innerHTML = `${robotName}번 로봇`;
        robotBattery.innerHTML = `${battery}%`;

        // 색상 변경한 것 적용
        robotData();
      }

      function openDemo(page) {
        if (
          // 0: Normal, 1: Driving, 2: Low Battery, 3: Emergency Stop, 4: Navigation Failure
          selectedAvailable === 1 ||
          selectedAvailable === 2 ||
          selectedAvailable === 3 ||
          selectedAvailable === 4
        ) {
          alert("현재 사용이 불가능한 로봇입니다. 다른 로봇을 선택해주세요.");
        } else {
          if (selectedRobot) {
            // destin = 0. 출발지 선택 모드, destin = 1. 목적지 선택 모드
            // const { destin } = getUrlParams();
            // const url = page + `.html?destin=${destin}&robot=${selectedRobot}`;
            // window.location.href = url;
            const destin = 0;
            localStorage.setItem("destin", destin);
            const robot = localStorage.setItem("robot", selectedRobot);
            const url = `${page}.html`;
            window.location.href = url;
          } else {
            alert("로봇을 선택해주세요");
          }
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>3D Gaussian Splat Viewer</title>
    <link rel="stylesheet" href="commonCss.css" />
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        background-color: black;
      }

      .selectrobot_container {
        display: flex;
        flex-direction: column;
        align-items: center;

        width: 100%;
      }

      .selectrobot_title {
        width: 100%;

        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /*.selectrobot_zoom_btns {
        position: absolute;
        right: 10px;
        bottom: 10px;
      }

      .selectrobot_zoom {
        color: #c0c0c0;
        border: 1px solid #c0c0c0;
        padding: 5px;
      }*/

      .selectrobot_check_btn {
        width: 300px;
        height: 80px;
        border-radius: 10px;
        font-size: large;
      }

      .selectrobot_map {
        display: flex;
        justify-content: center;

        position: relative;
      }

      #selectrobot_gaussian {
        height: 75vh;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 1000px) {
        #selectrobot_gaussian {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div id="header"></div>
    <div class="selectrobot_container">
      <div class="selectrobot_title">
        <h1 id="title">호출할 로봇을 선택해주세요</h1>
        <h3>빨간색으로 표시된 것은 사용 중인 로봇이니, 사용할 수 없습니다.</h3>
      </div>
      <div class="selectrobot_map" id="selectrobot_map">
        <!-- <div class="selectrobot_zoom_btns">
          <div class="selectrobot_zoom" id="selectrobot_zoom_in">+</div>
          <div class="selectrobot_zoom" id="selectrobot_zoom_out">-</div>
        </div> -->
        <img
          id="selectrobot_gaussian"
          alt="gaussian_img"
          src="assets/images/2dmap.png"
        />
      </div>

      <div class="selectrobot_check">
        <button class="selectrobot_check_btn" type="button">선택 완료</button>
      </div>
    </div>
    <script>
      // 헤더에 필요한 script
      document.addEventListener("DOMContentLoaded", () => {
        fetch("header.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          })
          .catch((error) => console.error("Error loading header:", error));
      });

      function openHome(page) {
        let url = page + ".html";
        window.location = url;
      }

      function goBack() {
        history.back();
      }
    </script>
    <script type="module">
      import { getRobots, client } from "./supaDatabase/connectDatabase.js";

      document.addEventListener("DOMContentLoaded", () => {
        document
          .querySelector(".selectrobot_check_btn")
          .addEventListener("click", () => openDemo("minimap"));
      });

      // 로봇 데이터
      robotData();

      // 실시간으로 DB 지켜보기
      client
        .channel("room1")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "robots" },
          (payload) => {
            robotData();
          }
        )
        .subscribe();

      // 로봇 데이터 가져오기
      async function robotData() {
        const robots = await getRobots();

        // 기존 마커 제거
        const markers = document.querySelectorAll(".robot_marker_container");
        markers.forEach((marker) => marker.remove());

        robots.forEach((robot) => {
          const marker_container = createRobotMarker(
            robot,
            "selectrobot_gaussian",
            selectedRobot
          );
          marker_container.style.cursor = "pointer";
          document
            .querySelector(".selectrobot_map")
            .appendChild(marker_container);

          marker_container.addEventListener("click", () => {
            updateTitle(robot.id, robot.status);
          });
        });
      }

      // 선택된 로봇 번호, 선택된 로봇의 상태
      let selectedRobot = null;
      let selectedAvailable = null;

      function updateTitle(robotName, available) {
        const title = document.getElementById("title");
        title.textContent = `호출할 로봇을 선택해주세요 (로봇 ${robotName})`;
        selectedRobot = robotName;
        selectedAvailable = available;

        // 색상 변경한 것 적용
        robotData();
      }

      // URL 파라미터 가져오기
      function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const destin = params.get("destin");

        return { destin };
      }

      function openDemo(page) {
        if (
          // 0: Normal, 1: Driving, 2: Low Battery, 3: Emergency Stop, 4: Navigation Failure
          selectedAvailable === 1
          // selectedAvailable === 2
          // selectedAvailable === 3
        ) {
          alert("현재 사용이 불가능한 로봇입니다. 다른 로봇을 선택해주세요.");
        } else {
          if (selectedRobot) {
            // destin = 0. 출발지 선택 모드, destin = 1. 목적지 선택 모드
            const { destin } = getUrlParams();
            const url = page + `.html?destin=${destin}&robot=${selectedRobot}`;
            window.location.href = url;
          } else {
            alert("로봇을 선택해주세요");
          }
        }
      }
    </script>
  </body>
</html>

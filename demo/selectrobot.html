<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>3D Gaussian Splat Viewer</title>
    <style>
      body {
        margin: 0;
        background-color: black;
      }

      .selectrobot_container {
        display: flex;
        flex-direction: column;
        align-items: center;

        width: 100%;
      }

      .selectrobot_title {
        width: 100%;

        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .selectrobot_zoom_btns {
        position: absolute;
        right: 10px;
        bottom: 10px;

        display: flex;
        flex-direction: column;
      }

      .selectrobot_zoom {
        color: #c0c0c0;
        border: 1px solid #c0c0c0;
        padding: 15px;
      }

      .selectrobot_check_btn {
        width: 250px;
        height: 80px;
        border-radius: 10px;
        font-size: large;
      }

      .selectrobot_map {
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* 넘치는 부분을 감춤 */
        border: 2px solid #333;
        position: relative;
      }

      #selectrobot_gaussian {
        width: auto;
        height: 70vh;
        width: 100%;
        cursor: grab;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 1000px) {
        #selectrobot_gaussian {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div id="header"></div>
    <div class="selectrobot_container">
      <div class="selectrobot_title">
        <h1 id="title">호출할 로봇을 선택해주세요</h1>
        <h3>빨간색으로 표시된 것은 사용 중인 로봇이니, 사용할 수 없습니다.</h3>
      </div>
      <div class="selectrobot_map" id="selectrobot_map">
        <img
          id="selectrobot_gaussian"
          alt="gaussian_img"
          src="assets/images/2dmap.png"
          draggable="false"
        />
      </div>

      <div class="selectrobot_check">
        <button class="selectrobot_check_btn" type="button">선택 완료</button>
      </div>
      <div class="selectrobot_zoom_btns">
        <button
          class="selectrobot_zoom"
          id="selectrobot_zoom_in"
          onclick="zoomIn();"
        >
          +
        </button>
        <button
          class="selectrobot_zoom"
          id="selectrobot_zoom_out"
          onclick="zoomOut()"
        >
          -
        </button>
      </div>
    </div>
    <script>
      // 헤더에 필요한 script
      document.addEventListener("DOMContentLoaded", () => {
        fetch("header.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          })
          .catch((error) => console.error("Error loading header:", error));
      });

      function openHome(page) {
        let url = page + ".html";
        window.location = url;
      }

      function goBack() {
        history.back();
      }
    </script>
    <script type="module">
      import { getRobots, client } from "./supaDatabase/connectDatabase.js";

      document.addEventListener("DOMContentLoaded", () => {
        document
          .querySelector(".selectrobot_check_btn")
          .addEventListener("click", () => openDemo("minimap"));
      });

      // 로봇 데이터
      robotData();

      // 실시간으로 DB 지켜보기
      client
        .channel("room1")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "robots" },
          (payload) => {
            robotData();
          }
        )
        .subscribe();

      // 로봇 데이터 가져오기
      let robots;
      async function robotData() {
        robots = await getRobots();

        // 기존 마커 제거
        const markers = document.querySelectorAll(
          ".selectrobot_robot_marker_container"
        );
        markers.forEach((marker) => marker.remove());

        robots.forEach((robot) => {
          const marker_container = createRobotMarker(robot);
          document
            .querySelector(".selectrobot_map")
            .appendChild(marker_container);
        });
      }

      // marker, label 색상 지정
      function applyColor(robot) {
        // 선택된 마커 색상 바꾸기
        if (robot.id === selectedRobot) {
          return "#12f3fb";
        }
        if (robot.status === 1) {
          // 사용중이라면?
          return "#ff0000";
        } else if (robot.battery < 30) {
          // 배터리가 30 이하라면?
          return "#f2d406";
        } else {
          // 나머지
          return "#1dd200";
        }
      }

      // 로봇 마커 생성 함수
      function createRobotMarker(robot) {
        // 미니맵의 정보
        const minimapRect = document
          .getElementById("selectrobot_gaussian")
          .getBoundingClientRect();
        // marker와 label을 넣을 container
        const container = document.createElement("div");
        container.className = "selectrobot_robot_marker_container";
        container.style.position = "absolute";
        container.style.left =
          ((robot.position[0] + 2238) * 100) / 3118 -
          (7.5 * 100) / minimapRect.width +
          "%";
        container.style.top =
          ((-robot.position[1] + 2820) * 100) / 3462 -
          (7.5 * 100) / minimapRect.height +
          "%";
        console.log(container.style.left, container.style.top);
        container.style.display = "flex";
        container.style.alignItems = "center";
        container.style.cursor = "pointer";
        container.dataset.robotId = robot.id; // robot id 저장

        // marker
        const marker = document.createElement("div");
        marker.className = "selectrobot_robot_marker";
        // marker 크기
        marker.style.width = "15px";
        marker.style.height = "15px";
        marker.style.borderRadius = "50%";
        marker.style.backgroundColor = applyColor(robot);

        // 로봇 ID 표시. label
        const label = document.createElement("span");
        label.innerHTML = `로봇 ${robot.id} (${robot.battery}%)`;
        label.style.color = applyColor(robot);
        label.style.fontSize = "10px";
        label.style.marginLeft = "5px";

        container.appendChild(marker);
        container.appendChild(label);

        container.addEventListener("click", () => {
          updateTitle(robot.id, robot.status);
        });

        return container;
      }

      // // 초기 확대 배율

      // let offsetX = 0,

      //   markers.forEach((container) => {

      // 선택된 로봇 번호, 선택된 로봇의 상태
      let selectedRobot = null;
      let selectedAvailable = null;

      function updateTitle(robotName, available) {
        const title = document.getElementById("title");
        title.textContent = `호출할 로봇을 선택해주세요 (로봇 ${robotName})`;
        selectedRobot = robotName;
        selectedAvailable = available;

        // 색상 변경한 것 적용
        robotData();
      }

      // URL 파라미터 가져오기
      function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const destin = params.get("destin");

        return { destin };
      }

      function openDemo(page) {
        if (
          // 0: 사용 가능, 1: 사용 불가, 2: 충전 중, 3: 주행 중
          // selectedAvailable === 1 ||
          selectedAvailable === 2
          // selectedAvailable === 3
        ) {
          alert("현재 사용이 불가능한 로봇입니다. 다른 로봇을 선택해주세요.");
        } else {
          if (selectedRobot) {
            // destin = 0. 출발지 선택 모드, destin = 1. 목적지 선택 모드
            const { destin } = getUrlParams();
            const url = page + `.html?destin=${destin}&robot=${selectedRobot}`;
            window.location.href = url;
          } else {
            alert("로봇을 선택해주세요");
          }
        }
      }

      window.zoomIn = zoomIn;
      window.zoomOut = zoomOut;

  </body>
</html>

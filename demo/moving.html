<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background-color: rgba(248, 248, 248, 1);
      }

      .moving_stop {
        position: absolute;
        top: 10px;
        left: 20px;
        margin: 10px;
        /* padding: 2% 10%; */
        border-radius: 50px;

        color: black;
        font-weight: bold;
        background-color: white;
        border: none;

        width: 84px;
        height: 42px;

        z-index: 2;
      }

      .moving_testbtn {
        z-index: 2;
      }

      /*미니맵 부분*/
      .moving_container {
        display: flex;
        flex-direction: column;
        align-items: center;

        width: 100%;
      }

      .moving_map_container {
        display: flex;
        justify-content: center;

        position: relative;
      }

      #moving_map {
        height: 80vh;
      }

      /* 전체 모달 배경 */
      #moving_modal {
        display: flex;
        pointer-events: none; /* 클릭 무시 */
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        justify-content: center;
        align-items: flex-end;
        z-index: 1000;
      }

      /* 모달 내용 */
      .moving_modal-content {
        display: flex;
        flex-direction: column;
        align-items: center;

        pointer-events: auto;
        background-color: white;
        width: 100%;
        max-height: 50%;
        border-radius: 28px 28px 0 0;
        padding: 20px;
      }

      .moving_modal_selectbtn {
        width: 100%;
        border-radius: 40px;
        padding: 15px 20px;

        background-color: white;
        border: 2px solid rgba(63, 226, 244, 1);

        font-weight: bold;
        margin-top: 29px;

        cursor: pointer;
      }

      .moving_modal_above {
        display: flex;
        justify-content: center;

        width: 100%;
        margin-bottom: 20px;

        font-weight: bold;
        font-size: 16px;
      }

      .moving_modal_middle {
        display: flex;

        margin-bottom: 10px;
        width: 90%;
        justify-content: space-between;
      }

      .moving_modal_first,
      .moving_modal_second {
        border-bottom: 5px solid rgba(164, 164, 164, 1);
        width: 49%;
        text-align: center;
        font-weight: bold;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 600px) {
        #moving_map {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="moving_container">
      <button class="moving_stop" onclick="stopRobot()">주행 취소</button>
      <button onclick="openPage()" class="moving_testbtn">임시 버튼</button>
      <div class="moving_map_container">
        <img id="moving_map" alt="2dmap" src="assets/images/Minimap2.png" />
      </div>
    </div>
    <div id="moving_modal">
      <div class="moving_modal-content">
        <div class="moving_modal_above"></div>
        <div class="moving_modal_middle">
          <div class="moving_modal_first">1번 목적지</div>
          <div class="moving_modal_second">2번 목적지</div>
        </div>
        <button class="moving_modal_selectbtn" onclick="startDestin()"></button>
      </div>
    </div>
  </body>
  <script>
    // 헤더
  </script>
  <script type="module">
    import {
      client,
      getRobots,
      insertRequest,
    } from "./supaDatabase/connectDatabase.js";

    // 2d 웹 좌표계(%)의 출발지와 목적지
    const start = JSON.parse(localStorage.getItem("start"));
    const end = JSON.parse(localStorage.getItem("end"));

    // 로봇 좌표계의 목적지
    const robotEnd = JSON.parse(localStorage.getItem("robotEnd"));

    let destin = 0; // 출발지인지 목적지인지. 0 : 출발지, 2 : 목적지
    const robotId = localStorage.getItem("robot"); // 선택된 로봇 번호

    window.openPage = openPage;
    window.stopRobot = stopRobot;

    // 로봇 정지 버튼
    function stopRobot() {
      const confirmStop = confirm(`로봇 ${robotId}을 즉시 정지하시겠습니까?`);

      if (confirmStop) {
        // DB에 정지 요청
        insertRequest(robotId, false);
        alert(`로봇 ${robotId}을 즉시 정지합니다.`);
      } else {
        // 사용자가 취소를 눌렀을 때
        alert("정지 요청이 취소되었습니다.");
      }
    }

    // 제목 설정
    setTitle();
    function setTitle() {
      const titleElement = document.querySelector(".moving_modal_above");
      const destinBar1 = document.querySelector(".moving_modal_first");
      const destinBar2 = document.querySelector(".moving_modal_second");
      const startBtn = document.querySelector(".moving_modal_selectbtn");

      // 출발지 or 목적지 마커 제거 후 생성
      const startDestinMarker = document.querySelectorAll(
        ".moving_start_marker"
      );
      startDestinMarker.forEach((index) => index.remove());

      marking(destin, start, end, ".moving_map_container");

      if (destin === 0) {
        titleElement.innerHTML = "로봇이 첫 번째 목적지로 이동중입니다.";
        startBtn.style.border = "1px solid rgba(164, 164, 164, 1)";
        startBtn.style.color = "rgba(164, 164, 164, 1)";
        startBtn.innerHTML = "주행 시작";
        startBtn.disabled = true;
      } else if (destin === 1) {
        titleElement.innerHTML = "로봇이 첫 번째 목적지에 도착했습니다.";
        destinBar1.style.borderBottom = "5px solid rgba(63, 226, 244, 1)";
        startBtn.style.border = "1px solid rgba(63, 226, 244, 1)";
        startBtn.style.color = "rgba(0, 0, 0, 1)";
        startBtn.disabled = false;
      } else if (destin === 2) {
        titleElement.innerHTML = "로봇이 두 번째 목적지로 이동중입니다.";
        startBtn.style.border = "1px solid rgba(164, 164, 164, 1)";
        startBtn.style.color = "rgba(164, 164, 164, 1)";
        startBtn.innerHTML = "주행 완료";
        startBtn.disabled = true;
      } else if (destin === 3) {
        titleElement.innerHTML = "로봇이 두 번째 목적지에 도착했습니다.";
        destinBar2.style.borderBottom = "5px solid rgba(63, 226, 244, 1)";
        startBtn.style.border = "1px solid rgba(63, 226, 244, 1)";
        startBtn.style.color = "rgba(0, 0, 0, 1)";
        startBtn.disabled = false;
      }
    }

    // 도착시 destin -> 1
    function destinComplete(complete) {
      if (complete) {
        destin = destin + 1;
        setTitle();
      }
    }

    // 주행 시작 버튼
    window.startDestin = startDestin;
    function startDestin() {
      if (destin === 1) {
        insertRequest(robotId, true, [
          robotEnd.clickedcoord.x,
          robotEnd.clickedcoord.y,
        ]);
        destin = destin + 1;
        setTitle();
      } else if (destin === 3) {
        // 페이지 이동
        window.location = `report.html`;
      }
    }

    // 데이터 불러오기
    robotData();
    // 실시간으로 로봇 정보 가져오기
    client
      .channel("robots")
      .on(
        "postgres_changes",
        { event: "UPDATE", schema: "public", table: "robots" },
        (payload) => {
          robotData();
        }
      )
      .subscribe();

    // 실시간으로 response 가져오기
    client
      .channel("response")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "response" },
        (payload) => {
          console.log(payload, robotId);
          if (payload.new.robot_id == robotId) {
            // 로봇 id에 맞는 정보 가져오기
            destinComplete(payload.new.complete);
          }
        }
      )
      .subscribe();

    // 로봇 데이터
    async function robotData() {
      const robots = await getRobots();

      const markers = document.querySelectorAll(".robot_marker_container");
      markers.forEach((marker) => marker.remove());

      robots.forEach((robot) => {
        if (robot.id === parseInt(robotId)) {
          const marker = createRobotMarker(robot, "moving_map", 0);
          document.querySelector(".moving_map_container").appendChild(marker);
        }
      });
    }

    function robotPath(path) {
      // path는 픽셀의 좌표를 array로 받아옴
      // 그 좌표를 이용하여 이미지 위에 점을 찍음
    }

    // 페이지 이동
    function openPage() {
      window.location = `report.html`;
    }
  </script>
</html>

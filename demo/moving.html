<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>3D Gaussian Splat Viewer</title>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background-color: black;
      }

      /*헤더부분*/
      .moving_header {
        width: 100%;
        background-color: white;

        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .moving_title {
        padding-top: 10px;
        font-size: 30px;
        font-weight: bold;
      }

      .moving_stop {
        margin: 10px;
        padding: 2% 10%;
        border-radius: 10px;

        color: white;
        background-color: red;
        border: none;
      }

      /*미니맵 부분*/
      .moving_container {
        display: flex;
        flex-direction: column;
        align-items: center;

        width: 100%;
      }

      .moving_map_container {
        display: flex;
        justify-content: center;

        position: relative;
      }

      #moving_map {
        height: 80vh;
      }

      .moving_robot_marker {
        position: absolute;
        width: 15px;
        height: 15px;
        border-radius: 10px;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 600px) {
        #moving_map {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="moving_header">
      <div class="moving_title">로봇이 이동 중입니다</div>
      <button class="moving_stop">이동 중지</button>
    </div>
    <div class="moving_container">
      <div class="moving_map_container">
        <img id="moving_map" alt="2dmap" src="assets/images/2dmap.png" />
      </div>
    </div>
  </body>
  <script type="module">
    import { client, getRobots } from "./supaDatabase/connectDatabase.js";

    const end = JSON.parse(localStorage.getItem("end")); // localStorage에서 출발지와 목적지를 불러옴
    const params = new URLSearchParams(window.location.search); // url에서 가져오기
    const robotId = params.get("robot"); // 선택된 로봇 번호

    // 로봇 데이터
    async function robotData() {
      const robots = await getRobots();

      const markers = document.querySelectorAll(".moving_robot_marker");
      markers.forEach((marker) => marker.remove());

      robots.forEach((robot) => {
        if (robot.id === parseInt(robotId)) {
          const marker = createRobotMarker(robot);
          document.querySelector(".moving_map_container").appendChild(marker);
        }
      });
    }

    // 로봇 마커 생성 함수
    function createRobotMarker(robot) {
      // 미니맵의 정보
      const minimapRect = document
        .getElementById("moving_map")
        .getBoundingClientRect();
      // marker와 label을 넣을 container
      const container = document.createElement("div");
      container.className = "moving_robot_marker_container";
      container.style.position = "absolute";
      container.style.left =
        ((robot.position[0] + 2238) * 100) / 3118 -
        (7.5 * 100) / minimapRect.width +
        "%";
      container.style.top =
        ((-robot.position[1] + 2820) * 100) / 3462 -
        (7.5 * 100) / minimapRect.height +
        "%";
      container.style.display = "flex";
      container.style.alignItems = "center";
      container.style.cursor = "pointer";

      // marker
      const marker = document.createElement("div");
      marker.className = "moving_robot_marker";
      // marker 크기
      marker.style.width = "15px";
      marker.style.height = "15px";
      marker.style.borderRadius = "50%";
      marker.style.backgroundColor = "#1dd200";

      // 로봇 ID 표시. label
      const label = document.createElement("span");
      label.innerHTML = `로봇 ${robot.id} (${robot.battery}%)`;
      label.style.color = "#1dd200";
      label.style.fontSize = "10px";
      label.style.marginLeft = "5px";

      container.appendChild(marker);
      container.appendChild(label);

      container.addEventListener("click", () => {
        updateTitle(robot.id, robot.status);
      });

      return container;
    }

    // 데이터 불러오기
    robotData();
    // 실시간으로 로봇 정보 가져오기
    client
      .channel("robots")
      .on(
        "postgres_changes",
        { event: "UPDATE", schema: "public", table: "robots" },
        (payload) => {
          robotData();
        }
      )
      .subscribe();

    document.addEventListener("DOMContentLoaded", () => {
      const start = JSON.parse(localStorage.getItem("start"));
      console.log(start);
      // 출발지 마커 표시
      const startMarker = document.createElement("div");
      startMarker.style.position = "absolute";
      startMarker.className = "moving_start_marker";
      startMarker.style.top = start.top + "%";
      startMarker.style.left = start.left + "%";
      startMarker.style.backgroundColor = "blue";
      startMarker.style.width = "15px";
      startMarker.style.height = "15px";
      startMarker.style.borderRadius = "15px";
      document.querySelector(".moving_map_container").appendChild(startMarker);
    });
  </script>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>3D Gaussian Splat Viewer</title>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
      }
      .moving_container {
        width: 100vw;
        height: 100vh;
      }
      #moving_map {
        width: 100%;
      }
      .moving_robot_marker {
        position: absolute;
        width: 15px;
        height: 15px;
        border-radius: 10px;
      }
      .moving_map_container {
        position: relative;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="moving_container">
      <div class="moving_map_container">
        <img id="moving_map" alt="2dmap" src="assets/images/2dmap.png" />
      </div>
    </div>
  </body>
  <script type="module">
    import { client, getRobots } from './supaDatabase/connectDatabase.js';
    // localStorage에서 출발지와 목적지를 불러옴
    const start = JSON.parse(localStorage.getItem('start'));
    const end = JSON.parse(localStorage.getItem('end'));
    // url에서 가져오기
    const params = new URLSearchParams(window.location.search);
    const robotId = params.get('robot'); // 선택된 로봇 번호

    // 로봇 데이터
    async function robotData() {
      const robots = await getRobots();

      const markers = document.querySelectorAll('.moving_robot_marker');
      markers.forEach((marker) => marker.remove());

      robots.forEach((robot) => {
        if (robot.id === parseInt(robotId)) {
          const marker = createRobotMarker(robot);
          document.querySelector('.moving_map_container').appendChild(marker);
        }
      });
    }

    // 로봇 마커 생성 함수
    function createRobotMarker(robot) {
      const marker = document.createElement('div');
      marker.className = 'moving_robot_marker';
      // % 로 표현하기 위해 사진의 width, hegith로 나눔
      // 로봇 원점이 이동한 거리만큼 더하기
      // + 15는 마커의 크기를 고려한 것
      marker.style.bottom = ((robot.position[1] + 642 - 15) * 100) / 3462 + '%';
      marker.style.left = ((robot.position[0] + 2238 - 15) * 100) / 3118 + '%';

      marker.style.backgroundColor = 'green';

      return marker;
    }

    // 데이터 불러오기
    robotData();
    // 실시간으로 로봇 정보 가져오기
    client
      .channel('robots')
      .on(
        'postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'robots' },
        (payload) => {
          robotData();
        }
      )
      .subscribe();

    document.addEventListener('DOMContentLoaded', () => {
      // 출발지 마커 표시
      const startMarker = document.createElement('div');
      startMarker.style.position = 'relative';
      startMarker.className = 'moving_start_marker';
      startMarker.style.bottom = start.bottom;
      startMarker.style.left = start.left;
      startMarker.style.backgroundColor = 'blue';
      startMarker.style.width = '15px';
      startMarker.style.height = '15px';
      startMarker.style.borderRadius = '15px';
      console.log(start);
      document.querySelector('.moving_map_container').appendChild(startMarker);
    });
  </script>
</html>

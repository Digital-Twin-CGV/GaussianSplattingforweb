<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <link rel="stylesheet" href="commonCss.css" />
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background-color: black;
      }

      /*헤더부분*/
      .moving_header {
        width: 100%;
        background-color: white;

        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #moving_title {
        padding-top: 10px;
        font-size: 30px;
        font-weight: bold;
      }

      .moving_stop {
        margin: 10px;
        padding: 2% 10%;
        border-radius: 10px;

        color: white;
        background-color: red;
        border: none;
      }

      /*미니맵 부분*/
      .moving_container {
        display: flex;
        flex-direction: column;
        align-items: center;

        width: 100%;
      }

      .moving_map_container {
        display: flex;
        justify-content: center;

        position: relative;
      }

      #moving_map {
        height: 80vh;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 600px) {
        #moving_map {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div id="header"></div>
    <div class="moving_header">
      <div id="moving_title"></div>
      <button class="moving_stop">이동 중지</button>
      <button onclick="openPage()">임시 버튼</button>
    </div>
    <div class="moving_container">
      <div class="moving_map_container">
        <img id="moving_map" alt="2dmap" src="assets/images/2dmap.png" />
      </div>
    </div>
  </body>
  <script>
    // 헤더
    document.addEventListener("DOMContentLoaded", () => {
      fetch("header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        })
        .catch((error) => console.error("Error loading header:", error));
    });

    function openHome(page) {
      let url = page + ".html";
      window.location = url;
    }

    function goBack() {
      console.log("뒤로가기");
      history.back();
    }
  </script>
  <script type="module">
    import { client, getRobots } from "./supaDatabase/connectDatabase.js";

    const end = JSON.parse(localStorage.getItem("end")); // localStorage에서 출발지와 목적지를 불러옴
    const params = new URLSearchParams(window.location.search); // url에서 가져오기
    const robotId = params.get("robot"); // 선택된 로봇 번호
    const destin = params.get("destin"); // 출발지인지 목적지인지. 0 : 출발지, 1 : 목적지

    window.openPage = openPage;
    // 제목 설정
    const titleElement = document.getElementById("moving_title");
    if (destin === "0") {
      titleElement.textContent = "출발지로 이동중입니다";
    } else if (destin === "1") {
      titleElement.textContent = "목적지로 이동중입니다";
    }

    // 데이터 불러오기
    robotData();
    // 실시간으로 로봇 정보 가져오기
    client
      .channel("robots")
      .on(
        "postgres_changes",
        { event: "UPDATE", schema: "public", table: "robots" },
        (payload) => {
          robotData();
        }
      )
      .subscribe();

    // 실시간으로 response 가져오기
    client
      .channel("response")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "response" },
        (payload) => {
          if (payload.new.robot_id == robotId) {
            // 로봇 id에 맞는 정보 가져오기
            destinComplete(payload.new.complete);
          }
        }
      )
      .subscribe();

    // 로봇 데이터
    async function robotData() {
      const robots = await getRobots();

      const markers = document.querySelectorAll(
        ".moving_robot_marker_container"
      );
      markers.forEach((marker) => marker.remove());

      robots.forEach((robot) => {
        if (robot.id === parseInt(robotId)) {
          const marker = createRobotMarker(robot, "moving_map", 0);
          document.querySelector(".moving_map_container").appendChild(marker);
        }
      });
    }

    // 출발지, 목적지 마커 표시
    document.addEventListener("DOMContentLoaded", () => {
      let markerLocation;
      if (destin == 0) {
        markerLocation = JSON.parse(localStorage.getItem("start"));
      } else if (destin == 1) {
        markerLocation = JSON.parse(localStorage.getItem("end"));
      }
      const destinMarkerContainer = document.createElement("div");
      destinMarkerContainer.style.position = "absolute";
      destinMarkerContainer.className = "moving_start_marker";
      destinMarkerContainer.style.top = markerLocation.top + "%";
      destinMarkerContainer.style.left = markerLocation.left + "%";
      destinMarkerContainer.style.display = "flex";
      destinMarkerContainer.style.alignItems = "flex-start";

      const destinMarker = document.createElement("div");
      destinMarker.style.backgroundColor = "blue";
      destinMarker.style.width = "10px";
      destinMarker.style.height = "10px";
      destinMarker.style.borderRadius = "50%";

      const destinLabel = document.createElement("span");
      destinLabel.innerHTML = destin == 0 ? "출발지" : "목적지";
      destinLabel.style.color = "blue";
      destinLabel.style.fontSize = "10px";
      destinLabel.style.marginLeft = "5px";

      destinMarkerContainer.appendChild(destinMarker);
      destinMarkerContainer.appendChild(destinLabel);

      document
        .querySelector(".moving_map_container")
        .appendChild(destinMarkerContainer);
    });

    function robotPath(path) {
      // path는 픽셀의 좌표를 array로 받아옴
      // 그 좌표를 이용하여 이미지 위에 점을 찍음
    }

    // 도착시 페이지 이동
    function destinComplete(complete) {
      if (complete) {
        openPage();
      }
    }

    // 페이지 이동
    function openPage() {
      if (destin == 0) {
        window.location = `checkpoint.html?robot=${robotId}`;
      } else if (destin == 1) {
        window.location = `report.html?robot=${robotId}`;
      }
    }
  </script>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div>
      이용해주셔서 감사합니다.
      <button class="report_home">홈으로</button>
      <button class="report_again">다시 사용하기</button>
    </div>
    <script type="module">
      const params = new URLSearchParams(window.location.search);
      const robotId = params.get("robot");
      document.querySelector(".report_home").onclick = function () {
        window.location.replace("index.html"); // stack에 담지 않기
      };

      document.querySelector(".report_again").onclick = function () {
        window.location.replace(`minimap.html?destin=0&robot=${robotId}`);
      };
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <script src="functions.js"></script>
    <style>
      body {
        margin: 0;
        background-color: rgba(255, 255, 255, 1);
      }

      .report-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .report-title {
        width: 100%;

        margin-top: 50px;
        font-size: 25px;
        font-weight: bold;

        background-color: white;
      }

      .report-map-container {
        display: flex;
        justify-content: center;

        position: relative;
      }

      .report-complete-btn {
        position: fixed;
        bottom: 20px;
        width: 80%;
        border-radius: 40px;
        padding: 15px 20px;

        background-color: rgba(248, 248, 248, 1);
        border: 1px solid rgba(63, 226, 244, 1);
      }

      #report-map {
        height: 80vh;
      }

      /* 모바일 화면 크기 기준 */
      @media screen and (max-width: 600px) {
        #report-map {
          height: 100%;
          width: 100%;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div class="report-container">
      <div>
        <div class="report-title">사용해주셔서 감사합니다!</div>
        <div class="report-map-container">
          <img id="report-map" alt="2dmap" src="assets/images/Minimap.png" />
        </div>
      </div>
      <button class="report-complete-btn" onclick="openPage()">
        사용 완료
      </button>
    </div>

    <script>
      function openPage() {
        window.location = "index.html";
      }
    </script>

    <script type="module">
      import { getRobots, client } from "./supaDatabase/connectDatabase.js";
      // 로봇 id
      const robotId = localStorage.getItem("robot");

      // 2d 웹 좌표계(%)의 출발지와 목적지
      const start = JSON.parse(localStorage.getItem("start"));
      const end = JSON.parse(localStorage.getItem("end"));

      // 출발지, 목적지 마커 표시
      marking(4, start, end, ".report-map-container");

      // 로봇 데이터
      robotData();

      // 실시간으로 DB 지켜보기
      client
        .channel("room1")
        .on(
          "postgres_changes",
          { event: "UPDATE", schema: "public", table: "robots" },
          (payload) => {
            robotData();
          }
        )
        .subscribe();

      // 로봇 데이터 가져오기
      async function robotData() {
        const robots = await getRobots();

        // 기존 마커 제거
        const markers = document.querySelectorAll(".robot_marker_container");
        markers.forEach((marker) => marker.remove());

        robots.forEach((robot) => {
          if (robot.id === parseInt(robotId)) {
            const marker_container = createRobotMarker(robot, "report-map", 0);
            document
              .querySelector(".report-map-container")
              .appendChild(marker_container);
          }
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <style>
      body {
        margin: 0;
      }

      .manage_container {
        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }
      .logo_container {
        width: 50vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #3fe2f4;
      }
      .login_container {
        width: 50vw;
        height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
      }

      .manage_code {
        display: flex;
        align-items: center;
      }

      .manage_text_label {
        font-size: 24px;
        color: #8e8e8e;
        margin-bottom: 4px;
        /* font-weight: bold; */
      }

      .manage_inputbox {
        display: flex;
        flex-direction: column;
        align-items: flex-end;

        color: #222222;
      }

      .manage_code_box {
        display: flex;
        flex-direction: column;
        align-items: left;
      }

      .manage_code_title {
        font-size: 64px;
        margin-bottom: 74px;
      }

      input:focus {
        background-color: white;
        outline: 2px solid #87eefa;
      }

      #manage_code,
      #user_name {
        width: 437px;
        height: 62px;
        margin-bottom: 24px;

        font-size: 20px;
        border-radius: 50px;
        border: 1px solid #87eefa;

        text-align: center;
      }

      #manage_check_btn {
        width: 437px;
        height: 64px;
        border: none;
        border-radius: 50px;
        background-color: #87eefa;

        font-size: 20px;
        font-weight: bold;
        color: white;

        padding: 20px 150px;

        cursor: pointer;
      }

      .error {
        height: 21px;
        color: red;
      }

      /* 반응형 */
      @media screen and (max-width: 1000px) {
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div class="manage_container">
      <div class="logo_container">
        <div class="logo">
          <svg
            width="364"
            height="124"
            viewBox="0 0 364 124"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M226.167 36.2338H241.369V49.2219C245.059 42.8754 255.243 34.1675 271.773 34.1675C276.939 34.1675 280.333 34.6103 283.285 35.6434V50.1075C280.038 48.6315 275.906 47.746 270.74 47.746C253.472 47.746 241.369 61.6197 241.369 76.9693V120.657H226.167V36.2338Z"

              d="M173.775 35.7585C196.62 36.3374 215 54.8748 215.33 77.781H215.338V120.366H201.916V109.471C194.279 116.663 183.992 121.072 172.673 121.072L171.573 121.057C148.885 120.483 130.599 102.197 130.024 79.5095L130.01 78.408C130.011 54.8459 149.111 35.7451 172.673 35.7449L173.775 35.7585ZM172.673 49.1667C156.524 49.1669 143.432 62.2585 143.432 78.408C143.432 94.5576 156.524 107.65 172.673 107.65C188.823 107.65 201.916 94.5577 201.916 78.408C201.915 62.2583 188.823 49.1667 172.673 49.1667Z"

          </svg>
        </div>
      </div>
      <div class="login_container">
        <!-- <img class="manage_bao" src="assets/images/won_bao.png" /> -->
        <div class="manage_inputbox">
          <div class="manage_code_box">
            <div class="manage_code_title">Login</div>
            <div class="manage_text_label">User Name</div>
            <input type="input" name="user_name" id="user_name" />
            <div class="manage_text_label">Password</div>
            <input type="password" name="manage_code" id="manage_code" />
          </div>
        </div>
        <button id="manage_check_btn">Login</button>
        <p id="error_message" class="error"></p>
      </div>
    </div>
    <script></script>
    <script type="module">
      import { getPassword } from "./supaDatabase/connectDatabase.js";

      async function checkUsername() {
        // 사용자 입력 값 가져오기
        const inputName = document.getElementById("user_name").value;

        // 에러 메시지 영역
        const errorMessage = document.getElementById("error_message");

        // 유효성 검사
        if (inputName == "") {
          // 일치하지 않으면 에러 메시지 표시
          errorMessage.textContent = "이름을 입력하세요.";
          return false;
        } else {
          errorMessage.textContent = "";
          return true;
        }
      }

      async function checkPassword() {
        const correctPw = await getPassword();

        // 사용자 입력 값 가져오기
        const inputPw = document.getElementById("manage_code").value;

        // 에러 메시지 영역
        const errorMessage = document.getElementById("error_message");

        // 유효성 검사
        if (inputPw == correctPw.password) {
          // 일치하면 다음 화면으로 이동
          openDemo("managerMap"); // 이동할 페이지
        } else {
          // 일치하지 않으면 에러 메시지 표시
          errorMessage.textContent = "코드가 틀렸습니다.";
        }
      }
      function openDemo(page) {
        // 창 넘어가는 함수
        let url = page + ".html"; // url 만들기기

        window.location = url;
      }

      document
        .getElementById("manage_check_btn")
        .addEventListener("click", checkPassword);

      document
        .getElementById("manage_code")
        .addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            checkPassword();
          }
        });

      window.addEventListener("pageshow", function () {
        // 페이지가 다시 표시될 때 입력 필드 초기화
        document.getElementById("manage_code").value = "";
        document.getElementById("error_message").textContent = "";
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>GARO</title>
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body>
    <div>
      <div>로봇이 출발지에 도착했습니다.</div>
      <button onclick="openPage('moving')">목적지로 이동 시작</button>
      <button onclick="openPage('index')">사용 중지</button>
    </div>
    <script type="module">
      import { insertRequest } from "./supaDatabase/connectDatabase.js";
      const robotEnd = JSON.parse(localStorage.getItem("robotEnd"));

      window.openPage = openPage;

      // url params
      function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const robot = params.get("robot");

        return { robot };
      }

      function openPage(page) {
        const { robot } = getUrlParams();
        const robotEnd = JSON.parse(localStorage.getItem("robotEnd"));
        if (page == "moving") {
          insertRequest(robot, true, [robotEnd.robotX, robotEnd.robotY]).then(
            () => {
              // moving 페이지
              window.location = `moving.html?robot=${robot}&destin=${1}`;
            }
          );
        } else if (page == "index") {
          // 홈으로
          window.location = `index.html`;
        }
      }
    </script>
  </body>
</html>
